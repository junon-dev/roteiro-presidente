<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3b4d">
<title>Roteiro do Presidente</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --tinta:#1d2430; --suave:#5b6472; --linha:#dfe3e8; --campo:#f8f9fb;
  --tesouros:#2f6f7a; --ministerio:#a8740f; --vida:#a33a2a;
  --fala-bg:#eef4fb; --fala-bd:#3b6fb6; --cons-bg:#fbf6ea; --cons-bd:#ead8ad;
  --sala:#6a4fb3; --sala-bg:#f3effb; --sc:#b4530b; --sc-bg:#fff3e8;
  --ok:#2e7d4f; --alerta:#c98a0b; --erro:#c0392b; --barra:#1f3b4d;
}
@media (prefers-color-scheme: dark){ :root:not([data-tema="claro"]){
  --bg:#12161c; --card:#1b2129; --tinta:#e6e9ee; --suave:#9aa4b2; --linha:#2c343f; --campo:#232a33;
  --fala-bg:#1d2a3a; --fala-bd:#6a9be0; --cons-bg:#2a2518; --cons-bd:#4a3f22; --sala-bg:#241f33; --sc-bg:#33251a;
  --tesouros:#4c9aa6; --ministerio:#d39b2c; --vida:#d0614f; --barra:#0d1a24;
}}
:root[data-tema="escuro"]{
  --bg:#12161c; --card:#1b2129; --tinta:#e6e9ee; --suave:#9aa4b2; --linha:#2c343f; --campo:#232a33;
  --fala-bg:#1d2a3a; --fala-bd:#6a9be0; --cons-bg:#2a2518; --cons-bd:#4a3f22; --sala-bg:#241f33; --sc-bg:#33251a;
  --tesouros:#4c9aa6; --ministerio:#d39b2c; --vida:#d0614f; --barra:#0d1a24;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tinta);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* Barra superior */
header.topo{position:sticky;top:0;z-index:20;background:var(--barra);color:#fff;padding:8px 14px calc(8px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
header .marca{font-weight:700;font-size:17px;margin-right:auto;white-space:nowrap}
header .marca small{display:block;font-weight:400;font-size:12px;opacity:.75}
.navsem{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border-radius:10px;padding:2px}
.navsem button{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:8px;font-size:20px}
.navsem button:active{background:rgba(255,255,255,.15)}
.navsem select{background:transparent;border:0;color:#fff;font-weight:600;max-width:46vw;padding:6px 2px}
.navsem select option{color:#000}
.btop{background:rgba(255,255,255,.12);border:0;color:#fff;padding:9px 13px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.btop.ativo{background:#fff;color:var(--barra)}
.btop svg{width:20px;height:20px}
.lang{display:flex;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.12)}
.lang button{border:0;background:none;color:#fff;padding:9px 12px;font-weight:700;min-height:42px}
.lang button.on{background:#fff;color:var(--barra)}
main{max-width:920px;margin:0 auto;padding:14px 14px 140px}
/* Cabeçalho da semana */
.cabsem{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--linha)}
.cabsem .sup{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);font-weight:600}
.cabsem h1{font-size:23px;margin:2px 0 10px;line-height:1.2}
.opcoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--linha);border-radius:999px;padding:6px 12px;background:var(--campo);font-size:15px;font-weight:600;min-height:42px;user-select:none}
.chip input[type=checkbox]{width:20px;height:20px;accent-color:var(--sc)}
.chip.on{border-color:var(--sc);background:var(--sc-bg)}
.chip.sala.on{border-color:var(--sala);background:var(--sala-bg)}
.chip.trava{opacity:.55}
.chip input[type=time]{border:0;background:transparent;font-weight:700;width:7.6em}
.lembretes{margin-top:10px;font-size:14px;color:var(--suave)}
.lembretes summary{cursor:pointer;font-weight:600;color:var(--tinta);padding:4px 0}
.lembretes ul{margin:4px 0 0;padding-left:18px}
/* Seções e blocos */
.secao{margin:16px 0 6px;padding:7px 12px;color:#fff;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.07em;border-radius:8px}
.secao.tesouros{background:var(--tesouros)}.secao.ministerio{background:var(--ministerio)}.secao.vida{background:var(--vida)}
.bloco{display:flex;gap:12px;background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin:8px 0;scroll-margin:90px 0 150px;transition:box-shadow .2s, border-color .2s}
.bloco .hora{width:52px;flex:none;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding-top:1px}
.bloco .cont{flex:1;min-width:0;border-left:4px solid #c9ced6;padding-left:12px}
.bloco.tesouros .cont{border-color:var(--tesouros)}.bloco.ministerio .cont{border-color:var(--ministerio)}.bloco.vida .cont{border-color:var(--vida)}
.bloco.sala{background:var(--sala-bg)} .bloco.sala .cont{border-left:4px dashed var(--sala)} .bloco.sala .tit{color:var(--sala)}
.bloco.scmuda{background:var(--sc-bg)} .bloco.scmuda .cont{border-color:var(--sc)} .bloco.scmuda .tit{color:var(--sc)}
.bloco.atual{border-color:var(--fala-bd);box-shadow:0 0 0 3px color-mix(in srgb, var(--fala-bd) 35%, transparent)}
.bloco.feito{opacity:.6}
.tit{font-weight:700;font-size:18px;line-height:1.3;margin-bottom:4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tit .dur{margin-left:auto;font-size:13px;font-weight:600;color:var(--suave);background:var(--campo);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ministerio);border:1.5px solid currentColor;border-radius:5px;padding:0 5px}
.fala{background:var(--fala-bg);border-left:3px solid var(--fala-bd);padding:8px 11px;margin:6px 0;border-radius:0 8px 8px 0;font-size:18px;line-height:1.55}
.instr{color:var(--suave);font-size:15px;margin:5px 0}
.instr b{color:var(--tinta)}
.nota-sc{background:var(--sc-bg);color:var(--sc);border-radius:8px;padding:8px 11px;margin:8px 0 8px 64px;font-size:15px;font-weight:500}
.dica{margin:4px 0 4px 64px;font-size:14px;color:var(--suave);font-style:italic}
input.campo{display:inline-block;border:1.5px solid #aeb6c2;border-radius:7px;background:var(--campo);padding:2px 8px;min-width:8.5em;max-width:100%;font-size:17px;font-weight:600;vertical-align:baseline;height:1.75em}
input.campo:placeholder-shown{font-weight:400}
input.campo::placeholder{color:#97a0ad;font-size:14px}
input.campo:focus{outline:none;border-color:var(--fala-bd);background:var(--card)}
textarea.campo{display:block;width:100%;border:1.5px solid #aeb6c2;border-radius:8px;background:var(--campo);padding:7px 9px;min-height:2.4em;resize:vertical;font-size:16px;margin-top:6px}
.linha-b{margin-top:6px;padding:6px 9px;border:1.5px dashed var(--sala);background:var(--sala-bg);border-radius:8px;color:var(--sala);font-size:15px}
.linha-b b{margin-right:6px}
/* Conselho */
.cons{margin-top:9px;background:var(--cons-bg);border:1px solid var(--cons-bd);border-radius:10px;padding:9px 12px;font-size:15.5px;transition:box-shadow .2s}
.cons.atual{box-shadow:0 0 0 3px color-mix(in srgb, var(--ministerio) 45%, transparent)}
.cons .ch{font-weight:800;color:var(--ministerio);font-size:13px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:8px;align-items:center}
.cons .ch span{font-weight:600;text-transform:none;letter-spacing:0}
.cons .lic{font-weight:700;margin:4px 0 2px}
.cons .obj{color:var(--suave);font-size:14.5px;margin-bottom:4px}
.cons .pontos{list-style:none;margin:4px 0;padding:0}
.cons .pontos li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-top:1px dashed var(--cons-bd)}
.cons .pontos li:first-child{border-top:0}
.cons .pontos input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--ok)}
.cons .pontos li.destaque{background:color-mix(in srgb, var(--ministerio) 13%, transparent);border-radius:6px;padding:6px;margin:2px -6px}
.cons .pontos li.destaque b{color:var(--ministerio)}
.cons .outros{font-size:14px;color:var(--suave);margin-top:4px}
.cons .outros summary{cursor:pointer}
.cons .passos{font-size:14.5px;margin:6px 0 2px;color:var(--suave)}
.cons .passos b{color:var(--tinta)}
.cons .aviso{font-size:13.5px;color:var(--suave);margin-top:4px}
ul.check{margin:4px 0;padding-left:20px;font-size:16px}
ul.check li{margin:4px 0}
.termino{text-align:right;color:var(--suave);margin-top:10px;font-size:15px}
/* Barra de presidir */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--barra);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;box-shadow:0 -3px 12px rgba(0,0,0,.25)}
body.presidir .barra{display:block}
.barra .in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.barra .rel{font-variant-numeric:tabular-nums;font-size:46px;font-weight:800;line-height:1;min-width:3.6em;text-align:center;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.08)}
.barra .rel.alerta{background:var(--alerta)} .barra .rel.estouro{background:var(--erro)} .barra .rel.pausa{opacity:.6}
.barra .info{min-width:0}
.barra .info .agora{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra .info .status{font-size:14px;opacity:.85;margin-top:2px}
.barra .info .status b.adi{color:#8fe3b0} .barra .info .status b.atr{color:#ffb4a8}
.barra .bt{display:flex;gap:8px}
.barra .bt button{width:58px;height:58px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;display:grid;place-items:center}
.barra .bt button.prox{background:#fff;color:var(--barra);width:74px}
.barra .bt svg{width:28px;height:28px}
/* Painéis (modais) */
.painel{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.painel.aberto{display:flex}
.painel .caixa{background:var(--card);border-radius:16px;max-width:720px;width:100%;padding:18px 20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.painel h2{margin:0 0 12px;font-size:22px;display:flex;align-items:center}
.painel h2 button{margin-left:auto;border:0;background:var(--campo);border-radius:10px;width:44px;height:44px;font-size:22px}
.painel h3{font-size:16px;margin:18px 0 8px;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.campoform{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--linha)}
.campoform label{font-weight:600}
.campoform small{display:block;color:var(--suave);font-weight:400;font-size:13.5px}
.campoform input[type=number],.campoform input[type=time],.campoform select{padding:8px 10px;border:1.5px solid var(--linha);border-radius:8px;background:var(--campo);width:7.5em}
.campoform input[type=checkbox]{width:24px;height:24px}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--campo);border:1.5px solid var(--linha);min-height:46px}
.btn.prim{background:var(--fala-bd);color:#fff;border-color:transparent}
.btn.perigo{color:var(--erro)}
.lista-ap{list-style:none;padding:0;margin:8px 0}
.lista-ap li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha)}
.lista-ap li .q{color:var(--suave);font-size:14px}
.lista-ap li button{margin-left:auto}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:15px}
.msg.ok{background:color-mix(in srgb, var(--ok) 15%, transparent)} .msg.erro{background:color-mix(in srgb, var(--erro) 15%, transparent)}
.drop{border:2px dashed var(--linha);border-radius:12px;padding:18px;text-align:center;color:var(--suave)}
.licoes-tabs{display:flex;gap:8px;margin-bottom:10px}
.licoes-tabs button{flex:1}
.licoes-tabs button.on{background:var(--fala-bd);color:#fff;border-color:transparent}
.lic-item{border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin:8px 0}
.lic-item h4{margin:0 0 4px;font-size:16.5px}
.lic-item p{margin:2px 0;color:var(--suave);font-size:14.5px}
.lic-item ol,.lic-item ul{margin:4px 0;padding-left:20px;font-size:15px}
.vazio{text-align:center;padding:40px 16px;color:var(--suave)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
body.presidir .toast{bottom:120px}
@media (max-width:640px){
  .bloco .hora{width:46px;font-size:16px} .nota-sc,.dica{margin-left:0}
  .barra .rel{font-size:36px} .barra .bt button{width:50px;height:50px}
  header .marca small{display:none}
}
@media print{
  header.topo,.barra,.painel,.opcoes,.lembretes,.noprint{display:none!important}
  body{background:#fff;font-size:12pt} main{padding:0;max-width:none}
  .bloco{break-inside:avoid;border:0;border-bottom:1px solid #ddd;border-radius:0;margin:0;padding:6px 0}
  .cabsem{border:0;padding:0}
  input.campo{border:0;border-bottom:1px solid #888;border-radius:0;background:none}
}
</style>
</head>
<body>
<header class="topo">
  <div class="marca"><span data-t="app">Roteiro do Presidente</span><small data-t="appsub">Reunião Vida e Ministério</small></div>
  <div class="navsem">
    <button id="semAnt" aria-label="Semana anterior">‹</button>
    <select id="selSemana" aria-label="Semana"></select>
    <button id="semProx" aria-label="Próxima semana">›</button>
  </div>
  <div class="lang"><button data-lang="pt">PT</button><button data-lang="es">ES</button></div>
  <button class="btop" id="btPresidir"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span data-t="presidir">Presidir</span></button>
  <button class="btop" id="btLicoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"/></svg><span data-t="licoes">Lições</span></button>
  <button class="btop" id="btApostilas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3h16v-3"/></svg><span data-t="apostilas">Apostilas</span></button>
  <button class="btop" id="btConfig" aria-label="Configurações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>

<main id="main"></main>

<div class="barra" id="barra"><div class="in">
  <div class="rel" id="relogio">0:00</div>
  <div class="info"><div class="agora" id="agoraTit"></div><div class="status" id="agoraStatus"></div></div>
  <div class="bt">
    <button id="bAnt" aria-label="Voltar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
    <button id="bPausa" aria-label="Pausar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <button id="bProx" class="prox" aria-label="Avançar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.6 16.6L10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
  </div>
</div></div>

<div class="painel" id="pConfig"><div class="caixa"></div></div>
<div class="painel" id="pApostilas"><div class="caixa"></div></div>
<div class="painel" id="pLicoes"><div class="caixa"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Leitor da apostila Vida e Ministério (PDF -> semanas). Funciona no navegador (pdf.js) e no Node. */
(function (root) {
  'use strict';

  const ACENTOS = { 'ˆ': '̂', '˜': '̃', '´': '́', '`': '̀', '¨': '̈', '¸': '̧', '˚': '̊', '^': '̂', '~': '̃' };

  /* ---------- 1. Itens de texto -> linhas -> segmentos ---------- */
  async function lerPaginas(pdf) {
    const paginas = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      const p = await pdf.getPage(n);
      const vp = p.getViewport({ scale: 1 });
      const tc = await p.getTextContent();
      const itens = [];
      for (const it of tc.items) {
        if (!it.str || !it.str.trim()) continue;
        const h = Math.abs(it.transform[3]) || Math.abs(it.transform[0]);
        itens.push({ s: it.str, x: it.transform[4], y: vp.height - it.transform[5], w: it.width, h });
      }
      paginas.push({ n, W: vp.width, H: vp.height, itens });
    }
    return paginas;
  }

  // Junta acentos soltos (ˆ ´ ˜ ¸) à letra que está embaixo deles
  const COMPAT = { '\u0301': /[aeiouıAEIOUy]/, '\u0300': /[aeiouıAEIOU]/, '\u0302': /[aeiouAEIOU]/, '\u0308': /[aeiouıAEIOU]/, '\u0303': /[aonAON]/, '\u0327': /[cC]/, '\u030A': /[aA]/ };
  function comporAcentos(itens) {
    const base = [], acentos = [];
    for (const it of itens) (ACENTOS[it.s.trim()] && it.s.trim().length === 1 ? acentos : base).push(it);
    for (const a of acentos) {
      const comb = ACENTOS[a.s.trim()];
      const cx = a.x + a.w / 2;
      let melhor = null, idxM = -1, dist = 1e9;
      for (const b of base) {
        if (Math.abs(b.y - a.y) > b.h * 0.9) continue;
        if (comb !== '\u0327' && a.y > b.y + 0.5) continue;   // acento fica acima da letra
        if (comb === '\u0327' && a.y < b.y - 2) continue;     // cedilha fica embaixo
        if (b.x > cx + 8 || b.x + b.w < cx - 8) continue;
        const L = b.s.length, cw = b.w / Math.max(1, L);
        for (let k = 0; k < L; k++) {
          if (!COMPAT[comb].test(b.s[k])) continue;
          const d = Math.abs(b.x + (k + 0.5) * cw - cx) + Math.abs(b.y - a.y) * 0.3;
          if (d < dist) { dist = d; melhor = b; idxM = k; }
        }
      }
      if (!melhor || dist > 6) continue;
      let ch = melhor.s[idxM];
      if (ch === 'ı') ch = 'i';
      melhor.s = melhor.s.slice(0, idxM) + (ch + comb).normalize('NFC') + melhor.s.slice(idxM + 1);
    }
    for (const b of base) b.s = b.s.replace(/ı/g, 'i');
    return base;
  }

  function linhasDaPagina(pg) {
    const itens = comporAcentos(pg.itens.map(i => Object.assign({}, i)));
    itens.sort((a, b) => a.y - b.y || a.x - b.x);
    const linhas = [];
    for (const it of itens) {
      let l = linhas.find(L => Math.abs(L.y - it.y) <= Math.max(2, it.h * 0.3));
      if (!l) { l = { y: it.y, itens: [] }; linhas.push(l); }
      l.itens.push(it);
    }
    const segs = [];
    for (const l of linhas) {
      l.itens.sort((a, b) => a.x - b.x);
      let seg = null, fim = -1e9;
      for (const it of l.itens) {
        const gap = it.x - fim;
        if (!seg || gap > Math.max(14, it.h * 1.6)) {
          seg = { y: l.y, x: it.x, h: it.h, partes: [], fim: 0 };
          segs.push(seg);
        } else if (gap > it.h * 0.15) seg.partes.push(' ');
        seg.partes.push(it.s);
        seg.h = Math.max(seg.h, it.h);
        fim = it.x + it.w;
        seg.fim = fim;
      }
    }
    for (const s of segs) s.txt = s.partes.join('').replace(/[\uE000-\uF8FF\u0000-\u001F\u0002\u0003]/g, '').replace(/\s+/g, ' ').trim();
    return segs;
  }

  // Ordem de leitura: cabeçalho, coluna esquerda, coluna direita
  function textoDaPagina(pg) {
    const segs = linhasDaPagina(pg).filter(s => s.h >= 7.6 && s.y < pg.H - 30);
    const meio = pg.W * 0.47;
    const cab = segs.filter(s => s.y < 22);
    const esq = segs.filter(s => s.y >= 22 && s.x < meio).sort((a, b) => a.y - b.y || a.x - b.x);
    const dir = segs.filter(s => s.y >= 22 && s.x >= meio).sort((a, b) => a.y - b.y || a.x - b.x);
    return { cab, linhas: [...esq, ...dir] };
  }

  /* ---------- 2. Texto -> semanas ---------- */
  const MESES = {
    JANEIRO: 1, FEVEREIRO: 2, 'MARÇO': 3, MARCO: 3, ABRIL: 4, MAIO: 5, JUNHO: 6, JULHO: 7, AGOSTO: 8, SETEMBRO: 9, OUTUBRO: 10, NOVEMBRO: 11, DEZEMBRO: 12,
    ENERO: 1, FEBRERO: 2, MARZO: 3, MAYO: 5, JUNIO: 6, JULIO: 7, SEPTIEMBRE: 9, SETIEMBRE: 9, OCTUBRE: 10, NOVIEMBRE: 11, DICIEMBRE: 12
  };
  const NOMES_MES = {
    pt: ['', 'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'],
    es: ['', 'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre']
  };
  const RX_MES = Object.keys(MESES).sort((a, b) => b.length - a.length).join('|');
  const RX_CAB = new RegExp('^(\\d{1,2})(?:DE(' + RX_MES + '))?(?:-|–|—|A)(\\d{1,2})\\D{0,3}?DE(' + RX_MES + ')(.*)$');

  const compacto = s => s.normalize('NFC').toUpperCase().replace(/\s+/g, '');

  function tituloLivro(resto) {
    // "JEREMIAS45-46" -> "Jeremias 45-46" ; "JEREMÍAS49,50" -> "Jeremías 49, 50"
    resto = (resto.split('|').map(x => x.trim()).find(x => /\p{Lu}/u.test(x)) || '').replace(/^[^0-9\p{Lu}]+/u, '');
    const m = resto.match(/^(\d?)(\p{Lu}+)(\d.*)?$/u);
    if (!m) return resto;
    const livro = m[2].charAt(0) + m[2].slice(1).toLowerCase();
    const caps = (m[3] || '').replace(/,(?=\d)/g, ', ');
    return ((m[1] ? m[1] + ' ' : '') + livro + ' ' + caps).trim();
  }

  function detectarIdioma(txt) {
    const t = txt.toUpperCase();
    const pt = (t.match(/CÂNTICO|ORAÇÃO|LIÇÃO|COMENTÁRIOS/g) || []).length;
    const es = (t.match(/CANCIÓN|ORACIÓN|LECCIÓN|PALABRAS DE/g) || []).length;
    return es > pt ? 'es' : 'pt';
  }

  const TIT_MINISTERIO = /^(Iniciando conversas|Cultivando o interesse|Fazendo disc[ií]pulos|Explicando suas cren[çc]as|Discurso|O que voc[êe] diria\?|Empiece conversaciones|Empecemos conversaciones|Haga revisitas|Hagamos revisitas|Haga disc[ií]pulos|Hagamos disc[ií]pulos|Explique sus creencias|Expliquemos (?:nuestras|sus) creencias|¿Qué (?:diría usted|dirías|diría)\?)/i;
  const TIT_SEM_ESTUDANTE = /^(O que voc[êe] diria\?|¿Qué (?:diría usted|dirías|diría)\?)/i;

  function analisarSemana(linhas, idioma) {
    const txt = linhas.join('\n');
    const sem = { partes: [] };
    const cantE = [...txt.matchAll(/(?:C[âa]ntico|Canci[óo]n)\s+(\d+)\s+(?:e oração|e ora[çc][ãa]o|y oraci[óo]n)/gi)].map(m => +m[1]);
    sem.cantico_inicial = cantE[0] || null;
    sem.cantico_final = cantE.length > 1 ? cantE[cantE.length - 1] : null;
    const meio = linhas.map(l => l.match(/^(?:C[âa]ntico|Canci[óo]n)\s+(\d+)\s*$/i)).find(Boolean);
    sem.cantico_meio = meio ? +meio[1] : null;

    // Cabeçalhos de partes: "N. Título (X min)" — o título pode quebrar em várias linhas
    const RX_MIN = /\((\d+)\s*mins?\.?\)/i;
    const inicios = [];
    for (let i = 0; i < linhas.length; i++) {
      const m = linhas[i].match(/^(\d{1,2})\.\s*(\S.*)$/);
      if (!m) continue;
      let tit = m[2], j = i, min = null;
      for (let k = 0; k < 3 && j < linhas.length; k++) {
        const mm = (k === 0 ? tit : linhas[j]).match(RX_MIN);
        if (mm) { min = +mm[1]; break; }
        j++;
        if (j < linhas.length) tit += '\n' + linhas[j];
      }
      if (min === null) continue;
      const corte = tit.search(RX_MIN);
      let titulo = tit.slice(0, corte).replace(/-\n/g, '').replace(/\n/g, ' ').trim();
      const resto = tit.slice(corte).replace(RX_MIN, '').trim();
      inicios.push({ i, fimCab: j, n: +m[1], titulo, min, resto });
    }
    // remove duplicados (mesmo número) mantendo o primeiro
    const vistos = new Set();
    const cabs = inicios.filter(c => !vistos.has(c.n) && vistos.add(c.n)).sort((a, b) => a.n - b.n);

    const PARADAS_MAI = /^(TESOUROS|TESOROS|FAÇA SEU|SEAMOS|NOSSA$|NUESTRA$|NOSSA VIDA|NUESTRA VIDA|VIDA CRIST|MEJORES MAESTROS|NO MINIST|DE LA BIBLIA$|PALAVRA DE DEUS)/;
    const PARADAS_MIN = /^(Coment[áa]rios finais|Palabras de conclusi[óo]n|Que joias|¿Qué perlas)/i;
    const PARADAS = { test: l => PARADAS_MAI.test(l) || PARADAS_MIN.test(l) };
    for (const c of cabs) {
      // detalhe: linhas depois do cabeçalho até o próximo cabeçalho ou título de seção
      const prox = inicios.filter(o => o.i > c.fimCab).map(o => o.i);
      const limite = prox.length ? Math.min(...prox) : linhas.length;
      const det = [];
      if (c.resto) det.push(c.resto);
      for (let k = c.fimCab + 1; k < limite; k++) {
        const l = linhas[k];
        if (PARADAS.test(l) || /^(?:C[âa]ntico|Canci[óo]n)\s+\d+/i.test(l)) break;
        det.push(l);
      }
      let detalhe = det.join(' ').replace(/(\p{L})- (\p{Ll})/gu, '$1$2').replace(/\s+/g, ' ').trim();
      const p = { n: c.n, titulo: c.titulo, min: c.min };
      const lic = detalhe.match(/\b(th|lmd)\s+(?:lição|lección|lecci[óo]n)\s+(\d+)(?:\s+(?:ponto|punto)\s+(\d+))?/i);
      if (lic) p.licao = { pub: lic[1].toLowerCase(), n: +lic[2], ponto: lic[3] ? +lic[3] : null, txt: lic[0] };
      const ap = detalhe.match(/lmd\s+ap[êe]ndice\s+A\s+(?:ponto|punto)\s+(\d+)/i);
      if (ap) p.apendiceA = +ap[1];
      if (/Considera[çc][ãa]o|An[áa]lisis con el auditorio/i.test(detalhe)) p.consideracao = true;
      p.detalhe = detalhe;
      sem.partes.push(p);
    }

    // Classificação por seção e tipo
    let secao = 'tesouros';
    for (const p of sem.partes) {
      if (p.n === 1) p.tipo = 'discurso';
      else if (p.n === 2) p.tipo = 'joias';
      else if (p.n === 3) { p.tipo = 'leitura'; const m = p.detalhe.match(/^([^(]+?)\s*\(/); p.passagem = m ? m[1].trim() : p.detalhe; }
      else {
        if (secao !== 'vida' && TIT_MINISTERIO.test(p.titulo)) secao = 'ministerio'; else secao = 'vida';
        if (secao === 'ministerio') {
          if (TIT_SEM_ESTUDANTE.test(p.titulo)) p.tipo = 'consideracao_min';
          else if (/^Discurso/i.test(p.titulo)) p.tipo = 'discurso_estudante';
          else if (/Explicando|Explique|Expliquemos/i.test(p.titulo) && /Discurso/i.test(p.detalhe) && !/Demonstra/i.test(p.detalhe)) p.tipo = 'discurso_estudante';
          else p.tipo = 'estudante';
        } else {
          if (/Estudo b[íi]blico de congrega|Estudio b[íi]blico de la congregaci/i.test(p.titulo)) { p.tipo = 'ebc'; const m = p.detalhe.match(/^[^.]*?\b(\w+ cap\.\s*\d+)/); p.materia = m ? m[1] : p.detalhe; }
          else if (/Necessidades locais|Necesidades de la congregaci/i.test(p.titulo)) p.tipo = 'necessidades';
          else p.tipo = 'consideracao';
        }
      }
      if (p.tipo === 'leitura') p.detalhe = (p.passagem || '') + (p.licao ? ' (' + p.licao.txt + ')' : '');
      if (p.sec !== 'vida') {
        const cena = p.detalhe.match(/\b(DE CASA EM CASA|TESTEMUNHO INFORMAL|TESTEMUNHO PÚBLICO|DE CASA EN CASA|PREDICACIÓN INFORMAL|PREDICACIÓN PÚBLICA)\.?/);
        if (cena) p.cena = cena[1];
        p.texto = p.detalhe
          .replace(cena ? cena[0] : '###', '')
          .replace(/\((?:lmd|th)\s[^)]*\)\.?/gi, '')
          .replace(/^\s*(Considera[çc][ãa]o|An[áa]lisis con el auditorio[^.]*)\.\s*/i, '')
          .replace(/\s+([.,;])/g, '$1').replace(/\s+/g, ' ').trim();
      }
      p.sec = p.n <= 3 ? 'tesouros' : (['estudante', 'discurso_estudante', 'consideracao_min'].includes(p.tipo) ? 'ministerio' : 'vida');
    }
    return sem;
  }

  async function analisarPDF(pdf, nomeArquivo) {
    const paginas = await lerPaginas(pdf);
    let todas = [];
    let ano = null;
    const blocos = []; // {cab, linhas}
    for (const pg of paginas) {
      const { cab, linhas } = textoDaPagina(pg);
      const txtPg = linhas.map(s => s.txt).join(' ');
      const cmp = compacto(txtPg);
      const ma = cmp.match(new RegExp('(?:' + RX_MES + ')(?:-|–|Y|E)(?:' + RX_MES + ')DE(20\\d\\d)'));
      if (!ano && ma) ano = +ma[1];
      blocos.push({ cab: cab.map(c => c.txt), linhas: linhas.map(s => s.txt), pagina: pg.n });
    }
    if (!ano) { const m = (nomeArquivo || '').match(/(20\d\d)(\d\d)/); ano = m ? +m[1] : new Date().getFullYear(); }
    const idioma = detectarIdioma(blocos.map(b => b.linhas.join(' ')).join(' '));

    // Fatiar por cabeçalho de semana
    const semanas = [];
    let atual = null;
    for (const b of blocos) {
      let cabSem = null;
      const cabTxt = compacto(b.cab.join('|'));
      const ic = cabTxt.search(/\d{1,2}(?:DE|-|–|—|A)/);
      if (ic >= 0) cabSem = cabTxt.slice(ic).match(RX_CAB);
      if (cabSem) {
        atual = { m: cabSem, linhas: [], paginas: [b.pagina] };
        semanas.push(atual);
      } else if (atual) atual.paginas.push(b.pagina);
      if (atual) atual.linhas.push(...b.linhas);
    }

    const out = [];
    let mesAnterior = null, anoCorr = ano;
    for (const s of semanas) {
      const [, d1, mes1, d2, mes2, resto] = s.m;
      const m2 = MESES[mes2], m1 = mes1 ? MESES[mes1] : m2;
      if (mesAnterior && m1 < mesAnterior) anoCorr++;
      mesAnterior = m2;
      const ini = new Date(Date.UTC(anoCorr, m1 - 1, +d1));
      const sem = analisarSemana(s.linhas, idioma);
      if (!sem.partes.some(p => p.n === 1) || sem.partes.length < 5) continue;
      sem.idioma = idioma;
      sem.inicio = ini.toISOString().slice(0, 10);
      sem.id = idioma + '-' + sem.inicio;
      const nm = NOMES_MES[idioma];
      sem.periodo = mes1 && m1 !== m2
        ? `${+d1} de ${nm[m1]} ${idioma === 'es' ? 'a' : '–'} ${+d2} de ${nm[m2]}`
        : `${+d1}–${+d2} de ${nm[m2]}`;
      sem.leitura = tituloLivro(resto);
      sem.origem = nomeArquivo || '';
      out.push(sem);
    }
    // "próxima semana" para os comentários finais
    for (let i = 0; i < out.length; i++) {
      const p = out[i + 1];
      if (p) out[i].proxima = resumoProxima(p);
    }
    return { idioma, ano, semanas: out };
  }

  function resumoProxima(s) {
    const t1 = s.partes.find(p => p.n === 1);
    const vida = s.partes.filter(p => p.sec === 'vida' && p.tipo !== 'ebc').map(p => p.titulo);
    const ebc = s.partes.find(p => p.tipo === 'ebc');
    return { periodo: s.periodo, leitura: s.leitura, tema: t1 ? t1.titulo : '', vida, ebc: ebc ? ebc.materia : '' };
  }

  const api = { analisarPDF, lerPaginas, textoDaPagina, analisarSemana, comporAcentos };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.LeitorApostila = api;
})(typeof window !== 'undefined' ? window : globalThis);

    14: { pt: { t: 'Chame atenção para os pontos principais', obj: 'Ajude a acompanhar a sequência de ideias e sua ligação com o tema.',
               p: ['Todos os pontos levaram ao objetivo do discurso.', 'Lembrou o tema ao longo da apresentação.', 'Poucos pontos principais, claros, com pausa entre eles.'] },
          es: { t: 'Destaque los puntos principales', obj: 'Ayude a seguir el hilo de ideas y su relación con el tema.',
               p: ['Todos los puntos llevaron al objetivo del discurso.', 'Recordó el tema a lo largo de la presentación.', 'Pocos puntos principales, claros, con una pausa entre ellos.'] } },
    15: { pt: { t: 'Fale com convicção', obj: 'Mostre que tem certeza de que o assunto é verdadeiro e importante.',
               p: ['Estava bem preparado e entendia as ideias principais.', 'Usou as próprias palavras, que transmitem convicção.', 'Mostrou certeza (volume, contato visual), sem parecer dono da verdade.'] },
          es: { t: 'Hable con convicción', obj: 'Muestre que está seguro de que el tema es verdadero e importante.',
               p: ['Estaba bien preparado y entendía las ideas principales.', 'Usó sus propias palabras, que transmiten convicción.', 'Mostró seguridad (volumen, contacto visual), sin parecer dueño de la verdad.'] } },
    16: { pt: { t: 'Concentre-se em coisas positivas', obj: 'Concentre-se na solução e fale de coisas que encorajam.',
               p: ['Viu o lado bom das pessoas e elogiou.', 'Não ficou falando de coisas negativas.', 'Usou a Palavra de Deus para dar esperança.'] },
          es: { t: 'Concéntrese en lo positivo', obj: 'Concéntrese en la solución y hable de cosas que animan.',
               p: ['Vio el lado bueno de las personas y las elogió.', 'No se quedó en lo negativo.', 'Usó la Palabra de Dios para dar esperanza.'] } },
    17: { pt: { t: 'Fale de modo fácil de entender', obj: 'Seja simples e fale de um modo que todos entendam.',
               p: ['Dominava a matéria e explicou com as próprias palavras.', 'Usou frases curtas e linguagem do dia a dia.', 'Explicou palavras, nomes ou costumes desconhecidos.'] },
          es: { t: 'Hable de forma fácil de entender', obj: 'Sea sencillo y hable de un modo que todos entiendan.',
               p: ['Dominaba el tema y lo explicó con sus propias palabras.', 'Usó frases cortas y lenguaje cotidiano.', 'Explicó palabras, nombres o costumbres poco conocidos.'] } },
    18: { pt: { t: 'Use informações interessantes', obj: 'Faça as pessoas pensarem com informações interessantes para elas.',
               p: ['Levou em conta o que já sabem e destacou um detalhe novo.', 'Pesquisou e usou informações ligadas ao assunto.', 'Mostrou como o assunto ajuda no dia a dia.'] },
          es: { t: 'Use información interesante', obj: 'Haga pensar a las personas con información interesante para ellas.',
               p: ['Tuvo en cuenta lo que ya saben y destacó un detalle nuevo.', 'Investigó y usó información relacionada con el tema.', 'Mostró cómo el tema ayuda en la vida diaria.'] } },
    19: { pt: { t: 'Toque o coração das pessoas', obj: 'Ajude as pessoas a valorizar o que aprenderam e agir de acordo.',
               p: ['Fez perguntas que ajudam a analisar os sentimentos.', 'Incentivou a motivação correta, raciocinando sem repreender.', 'Manteve Jeová como o foco.'] },
          es: { t: 'Llegue al corazón', obj: 'Ayude a las personas a valorar lo aprendido y a actuar en consecuencia.',
               p: ['Hizo preguntas que ayudan a analizar los sentimientos.', 'Fomentó la motivación correcta, razonando sin reprender.', 'Mantuvo a Jehová como el centro.'] } },
    20: { pt: { t: 'Faça uma boa conclusão', obj: 'Relembre as ideias principais e incentive a agir.',
               p: ['A conclusão estava ligada ao tema e relembrou os pontos.', 'Deu um incentivo claro: o que fazer e por quê.', 'Foi simples e breve, sem pressa, em tom de conclusão.'] },
          es: { t: 'Termine bien', obj: 'Repase las ideas principales y anime a actuar.',
               p: ['La conclusión estaba relacionada con el tema y repasó los puntos.', 'Dio un estímulo claro: qué hacer y por qué.', 'Fue sencilla y breve, sin prisas, en tono de conclusión.'] } },
  },
  lmd: {
    1:  { secao: 1, pt: { t: 'Interesse pelas pessoas', l: 'A conversa vai melhor quando falamos de algo que interessa à pessoa.',
               p: { 3: ['Seja flexível', 'Começou com algo que está sendo comentado, sem insistir no assunto planejado.'], 4: ['Seja observador', 'Percebeu o que a pessoa fazia, sua cultura e se era um bom momento.'], 5: ['Escute', 'Não falou demais e incentivou a pessoa a se expressar.'] } },
          es: { t: 'Interés en las personas', l: 'La conversación va mejor cuando hablamos de algo que le interesa a la persona.',
               p: { 3: ['Sea flexible', 'Empezó con algo de actualidad, sin insistir en el tema que tenía pensado.'], 4: ['Sea observador', 'Notó lo que la persona hacía, su cultura y si era un buen momento.'], 5: ['Escuche', 'No habló demasiado y animó a la persona a expresarse.'] } } },
    2:  { secao: 1, pt: { t: 'Naturalidade', l: 'Deixar a conversa fluir naturalmente deixa a pessoa à vontade para ouvir.',
               p: { 3: ['Seja observador', 'Leu a linguagem corporal; se a pessoa estava disposta, puxou a Bíblia com naturalidade ("Você sabia que...?"); se não, não forçou.'], 4: ['Seja paciente', 'Esperou o momento certo para falar da Bíblia, mesmo que só na próxima conversa.'], 5: ['Seja adaptável', 'Acompanhou o assunto que a pessoa trouxe e compartilhou um ponto importante para ela.'] } },
          es: { t: 'Naturalidad', l: 'Dejar que la conversación fluya con naturalidad hace que la persona se sienta cómoda para escuchar.',
               p: { 3: ['Sea observador', 'Leyó el lenguaje corporal; si la persona estaba dispuesta, pasó a la Biblia con naturalidad ("¿Sabía que...?"); si no, no forzó.'], 4: ['Sea paciente', 'Esperó el momento oportuno para hablar de la Biblia, aunque fuera en la próxima conversación.'], 5: ['Sea adaptable', 'Siguió el tema que sacó la persona y compartió un punto importante para ella.'] } } },
    3:  { secao: 1, pt: { t: 'Bondade', l: 'A pessoa escuta melhor quando sente que nos importamos com ela.',
               p: { 3: ['Tenha empatia', 'Imaginou as preocupações da pessoa e ouviu sem mudar de assunto.'], 4: ['Fale com bondade e respeito', 'Escolheu bem as palavras e o tom; evitou ofender.'], 5: ['Seja prestativo', 'Ofereceu ajuda prática quando apropriado, abrindo caminho para a conversa.'] } },
          es: { t: 'Bondad', l: 'La persona escucha mejor cuando siente que nos importa.',
               p: { 3: ['Tenga empatía', 'Imaginó las preocupaciones de la persona y escuchó sin cambiar de tema.'], 4: ['Hable con bondad y respeto', 'Eligió bien las palabras y el tono; evitó ofender.'], 5: ['Sea servicial', 'Ofreció ayuda práctica cuando fue apropiado, abriendo paso a la conversación.'] } } },
    4:  { secao: 1, pt: { t: 'Humildade', l: 'A mensagem fica mais atraente quando falamos com humildade e respeito.',
               p: { 3: ['Não fale com ar de superioridade', 'Falou com respeito, sem dar a impressão de saber tudo.'], 4: ['Deixe claro que o ensino vem da Bíblia', 'Usou a Bíblia como base, não suas ideias.'], 5: ['Mantenha a calma', 'Não insistiu em provar que estava certo; soube a hora de encerrar com brandura.'] } },
          es: { t: 'Humildad', l: 'El mensaje resulta más atractivo cuando hablamos con humildad y respeto.',
               p: { 3: ['No hable con aires de superioridad', 'Habló con respeto, sin dar la impresión de saberlo todo.'], 4: ['Deje claro que lo que enseña viene de la Biblia', 'Usó la Biblia como base, no sus propias ideas.'], 5: ['Mantenga la calma', 'No insistió en tener la razón; supo cuándo terminar con apacibilidad.'] } } },
    5:  { secao: 1, pt: { t: 'Tato', l: 'As pessoas escutam melhor quando escolhemos o que dizer, como e quando.',
               p: { 3: ['Escolha bem as palavras', 'Ajustou o modo de falar à pessoa (por ex., cultura não cristã).'], 4: ['Não corrija logo a pessoa', 'Deixou a pessoa se expressar sem discutir.'], 5: ['Concorde e elogie quando possível', 'Começou por pontos em comum e, aos poucos, mostrou o que a Bíblia ensina.'] } },
          es: { t: 'Tacto', l: 'La gente escucha mejor cuando elegimos qué decir, cómo y cuándo.',
               p: { 3: ['Elija bien las palabras', 'Adaptó su forma de hablar a la persona (por ejemplo, de cultura no cristiana).'], 4: ['No corrija enseguida a la persona', 'Dejó que la persona se expresara sin discutir.'], 5: ['Cuando pueda, coincida y elogie', 'Empezó por puntos en común y, poco a poco, mostró lo que enseña la Biblia.'] } } },
    6:  { secao: 1, pt: { t: 'Coragem', l: 'Precisamos de coragem para pregar a todos, sem parcialidade.',
               p: { 3: ['Confie em Jeová', 'Pediu ajuda a Jeová para vencer o medo.'], 4: ['Não julgue as pessoas', 'Não deixou aparência, condição ou crenças impedirem a conversa.'], 5: ['Seja corajoso, com tato e cautela', 'Evitou discussões e encerrou com educação quando necessário.'] } },
          es: { t: 'Valor', l: 'Necesitamos valor para predicar a todos, sin parcialidad.',
               p: { 3: ['Confíe en Jehová', 'Pidió ayuda a Jehová para vencer el miedo.'], 4: ['No juzgue a las personas', 'No dejó que la apariencia, la condición o las creencias impidieran la conversación.'], 5: ['Sea valiente, con tacto y prudencia', 'Evitó discusiones y terminó con educación cuando fue necesario.'] } } },
    7:  { secao: 2, pt: { t: 'Perseverança', l: 'É preciso dedicar tempo e energia a boas revisitas e a começar estudos.',
               p: { 3: ['Ajuste sua programação', 'Procurou um horário bom para a pessoa.'], 4: ['Marque a próxima conversa', 'Combinou um momento específico para continuar.'], 5: ['Não perca a esperança', 'Persistiu com equilíbrio, usando bem o tempo.'] } },
          es: { t: 'Perseverancia', l: 'Hay que dedicar tiempo y energía a buenas revisitas y a empezar cursos bíblicos.',
               p: { 3: ['Ajuste su horario', 'Buscó un horario que le convenga a la persona.'], 4: ['Acuerde la próxima conversación', 'Concretó un momento específico para continuar.'], 5: ['No pierda la esperanza', 'Persistió con equilibrio, usando bien el tiempo.'] } } },
    8:  { secao: 2, pt: { t: 'Paciência', l: 'Algumas pessoas demoram mais para aceitar as boas novas.',
               p: { 3: ['Tente um método diferente', 'Não pressionou; usou vídeo ou artigo para mostrar como é um estudo.'], 4: ['Não faça comparações', 'Procurou entender os motivos da pessoa e deu tempo para ela pensar.'], 5: ['Ore pela pessoa', 'Pediu a Jeová para continuar positivo e ter discernimento.'] } },
          es: { t: 'Paciencia', l: 'Algunas personas tardan más en aceptar las buenas noticias.',
               p: { 3: ['Pruebe otro método', 'No presionó; usó un video o un artículo para mostrar cómo es un curso.'], 4: ['No haga comparaciones', 'Intentó entender los motivos de la persona y le dio tiempo para pensar.'], 5: ['Ore por la persona', 'Le pidió a Jehová seguir siendo positivo y tener discernimiento.'] } } },
    9:  { secao: 2, pt: { t: 'Empatia', l: 'Com empatia nos importamos com as pessoas, não só com a mensagem.',
               p: { 3: ['Escute com atenção', 'Não interrompeu nem ignorou sentimentos ou objeções.'], 4: ['Pense na pessoa interessada', 'Mostrou por que ela precisa das boas novas e como o estudo a ajudaria.'], 5: ['Use informações que se encaixem nas necessidades dela', 'Mostrou como o estudo responde às perguntas dela.'] } },
          es: { t: 'Empatía', l: 'Con empatía nos importan las personas, no solo el mensaje.',
               p: { 3: ['Escuche con atención', 'No interrumpió ni pasó por alto sentimientos u objeciones.'], 4: ['Piense en la persona interesada', 'Mostró por qué necesita las buenas noticias y cómo le ayudaría el curso.'], 5: ['Use información que encaje con sus necesidades', 'Mostró cómo el curso responde a sus preguntas.'] } } },
    10: { secao: 3, pt: { t: 'Senso de compromisso', l: 'Mostramos amor quando estamos decididos a ajudar a pessoa a se tornar discípulo.',
               p: { 3: ['Estude na hora e no lugar bons para o estudante', 'Adaptou-se às necessidades do estudante.'], 4: ['Estude regularmente', 'Remarcou, usou telefone/vídeo ou pediu a outro publicador, sem cancelar.'], 5: ['Ore pela atitude certa', 'Não desistiu do estudante; concentrou-se nas qualidades dele.'] } },
          es: { t: 'Compromiso', l: 'Mostramos amor cuando estamos decididos a ayudar a la persona a hacerse discípulo.',
               p: { 3: ['Estudie cuando y donde le convenga al estudiante', 'Se adaptó a las necesidades del estudiante.'], 4: ['Estudie con regularidad', 'Cambió el día, usó teléfono/video o pidió ayuda a otro publicador, sin cancelar.'], 5: ['Ore para tener la actitud correcta', 'No se rindió con el estudiante; se centró en sus cualidades.'] } } },
    11: { secao: 3, pt: { t: 'Simplicidade', l: 'Ensino simples é lembrado e toca o coração.',
               p: { 3: ['Não fale demais', 'Concentrou-se na matéria, esperou as respostas e usou perguntas adicionais.'], 4: ['Ligue o que já aprendeu ao que está aprendendo', 'Recapitulou brevemente para conectar os ensinos.'], 5: ['Saiba usar as ilustrações', 'Ilustração simples, fácil de entender e ligada ao ponto principal.'] } },
          es: { t: 'Sencillez', l: 'La enseñanza sencilla se recuerda y llega al corazón.',
               p: { 3: ['No hable demasiado', 'Se centró en el material, esperó las respuestas y usó preguntas adicionales.'], 4: ['Relacione lo que ya aprendió con lo que aprende ahora', 'Repasó brevemente para conectar las enseñanzas.'], 5: ['Use bien las ilustraciones', 'Ilustración sencilla, fácil de entender y relacionada con el punto principal.'] } } },
    12: { secao: 3, pt: { t: 'Franqueza', l: 'Para ajudar o estudante a progredir, falamos com amor e franqueza.',

<script>
const SEMANAS_EMBUTIDAS = [{"partes":[{"n":1,"titulo":"Meditar nas qualidades de Jeová fortalece a nossa fé","min":10,"detalhe":"O poder de Jeová prova que ele pode nos ajudar. (Jer. 32:17; wp19.1 6 § 1–7 § 1) O amor leal de Jeová nos garante que ele quer nos ajudar. (Jer. 32:18; w21.11 7 § 18) O senso de justiça de Jeová nos lembra de que ele vê a injustiça e vai acabar com ela. (Jer. 32:19; w25.10 21 § 15) SUGESTÃO PARA SUA ADORAÇÃO EM FAMÍLIA: Assistam ao VÍDEO Compre um Campo em Anatote, e conversem sobre como uma instrução que Jeová deu a Jeremias fortaleceu a fé dele e como também pode fortalecer a nossa. — Jer. 32:6-8.","tipo":"discurso","texto":"O poder de Jeová prova que ele pode nos ajudar. (Jer. 32:17; wp19.1 6 § 1–7 § 1) O amor leal de Jeová nos garante que ele quer nos ajudar. (Jer. 32:18; w21.11 7 § 18) O senso de justiça de Jeová nos lembra de que ele vê a injustiça e vai acabar com ela. (Jer. 32:19; w25.10 21 § 15) SUGESTÃO PARA SUA ADORAÇÃO EM FAMÍLIA: Assistam ao VÍDEO Compre um Campo em Anatote, e conversem sobre como uma instrução que Jeová deu a Jeremias fortaleceu a fé dele e como também pode fortalecer a nossa. — Jer. 32:6-8.","sec":"tesouros"},{"n":2,"titulo":"Joias espirituais","min":10,"detalhe":"Jer. 33:23, 24 — Quais são “as duas famílias” mencionadas aqui? (w07 15/3 11 § 4)","tipo":"joias","texto":"Jer. 33:23, 24 — Quais são “as duas famílias” mencionadas aqui? (w07 15/3 11 § 4)","sec":"tesouros"},{"n":3,"titulo":"Leitura da Bíblia","min":4,"licao":{"pub":"th","n":2,"ponto":null,"txt":"th lição 2"},"detalhe":"Jer. 32:6-18 (th lição 2)","tipo":"leitura","passagem":"Jer. 32:6-18","texto":"Jer. 32:6-18","sec":"tesouros"},{"n":4,"titulo":"Iniciando conversas","min":3,"licao":{"pub":"lmd","n":4,"ponto":3,"txt":"lmd lição 4 ponto 3"},"detalhe":"DE CASA EM CASA. Ofereça um estudo bíblico. (lmd lição 4 ponto 3)","tipo":"estudante","cena":"DE CASA EM CASA","texto":"Ofereça um estudo bíblico.","sec":"ministerio"},{"n":5,"titulo":"Iniciando convers {"partes":[{"n":1,"titulo":"Jeová apoia aqueles que apoiam o Seu Reino","min":10,"detalhe":"Em uma época de divisão política, Jeremias pregou uma mensagem que não agradava as pessoas. (Jer. 37:6-10; jr 27 § 22) Ele foi perseguido porque as pessoas entenderam errado a posição dele. (Jer. 37:13-15; jr 28 § 23) Jeová ajudou Jeremias enquanto ele estava preso. (Jer. 37:21; w08 15/10 11 § 18) PERGUNTE-SE: ‘Como o exemplo de Jeremias e de outros me incentivam a apoiar o Reino de Deus em épocas de instabilidade política?’","tipo":"discurso","texto":"Em uma época de divisão política, Jeremias pregou uma mensagem que não agradava as pessoas. (Jer. 37:6-10; jr 27 § 22) Ele foi perseguido porque as pessoas entenderam errado a posição dele. (Jer. 37:13-15; jr 28 § 23) Jeová ajudou Jeremias enquanto ele estava preso. (Jer. 37:21; w08 15/10 11 § 18) PERGUNTE-SE: ‘Como o exemplo de Jeremias e de outros me incentivam a apoiar o Reino de Deus em épocas de instabilidade política?’","sec":"tesouros"},{"n":2,"titulo":"Joias espirituais","min":10,"detalhe":"Jer. 36:30 — Como essa profecia sobre Jeoiaquim se cumpriu? (it “Jeoiaquim” § 9)","tipo":"joias","texto":"Jer. 36:30 — Como essa profecia sobre Jeoiaquim se cumpriu? (it “Jeoiaquim” § 9)","sec":"tesouros"},{"n":3,"titulo":"Leitura da Bíblia","min":4,"licao":{"pub":"th","n":10,"ponto":null,"txt":"th lição 10"},"detalhe":"Jer. 36:1-13 (th lição 10)","tipo":"leitura","passagem":"Jer. 36:1-13","texto":"Jer. 36:1-13","sec":"tesouros"},{"n":4,"titulo":"Iniciando conversas","min":3,"licao":{"pub":"lmd","n":5,"ponto":5,"txt":"lmd lição 5 ponto 5"},"detalhe":"TESTEMUNHO PÚBLICO. Ofereça um estudo bíblico para uma pessoa de uma cultura não cristã. (lmd lição 5 ponto 5)","tipo":"estudante","cena":"TESTEMUNHO PÚBLICO","texto":"Ofereça um estudo bíblico para uma pessoa de uma cultura não cristã.","sec":"ministerio"},{"n":5,"titulo":"Cultivando o interesse","min":4,"licao":{"pub":"lmd","n":9,"ponto":4,"txt":"lmd lição 9 ponto 4"},"detalhe":"DE CAS isse que Jeová é “protetor das viúvas”. (Sal. 68:5) A Bíblia dá muitos exemplos que mostram como ele se importa com elas. ˙ Usando as ferramentas de pesquisa disponíveis no seu idioma, encontre um ou dois relatos bíblicos que falam de viúvas. Como essas histórias mostram que Jeová ama e cuida das viúvas? Se você é viúva, tenha certeza de que Jeová entende as suas necessidades e sentimentos mais profundos. Ele vai te proteger e te ajudar, assim como fez com muitas pessoas no passado e continua fazendo até hoje. Mostre o VÍDEO Recuperei a Alegria e o Sentido na Vida mesmo Depois de Perder Meu Marido. Depois, pergunte: ˙ O que você aprendeu desse vídeo sobre como Jeová cuida das viúvas hoje? Honrar e ajudar as viúvas é uma parte importante da nossa adoração a Jeová. (Tia. 1:27; nota de estudo “Mostre consideração pelas” em 1 Tim. 5:3, nwtsty) ˙ Como podemos honrar as viúvas hoje?","tipo":"consideracao","texto":"O rei Davi disse que Jeová é “protetor das viúvas”. (Sal. 68:5) A Bíblia dá muitos exemplos que mostram como ele se importa com elas. ˙ Usando as ferramentas de pesquisa disponíveis no seu idioma, encontre um ou dois relatos bíblicos que falam de viúvas. Como essas histórias mostram que Jeová ama e cuida das viúvas? Se você é viúva, tenha certeza de que Jeová entende as suas necessidades e sentimentos mais profundos. Ele vai te proteger e te ajudar, assim como fez com muitas pessoas no passado e continua fazendo até hoje. Mostre o VÍDEO Recuperei a Alegria e o Sentido na Vida mesmo Depois de Perder Meu Marido. Depois, pergunte: ˙ O que você aprendeu desse vídeo sobre como Jeová cuida das viúvas hoje? Honrar e ajudar as viúvas é uma parte importante da nossa adoração a Jeová. (Tia. 1:27; nota de estudo “Mostre consideração pelas” em 1 Tim. 5:3, nwtsty) ˙ Como podemos honrar as viúvas hoje?","sec":"vida"},{"n":9,"titulo":"Estudo bíblico de congregação","min":30,"detalhe":"wcg cap. 11","tipo":"ebc","materia":"wcg cap. 11","texto":"wcg cap. 11","sec":"vida"}],"canti .pdf","proxima":{"periodo":"19–25 de outubro","leitura":"Jeremias 45-46","tema":"Ter esperança é o segredo para o contentamento","vida":["‘Partilhe com outros o que você tem’"],"ebc":"wcg cap. 13"}},{"partes":[{"n":1,"titulo":"Ter esperança é o segredo para o contentamento","min":10,"detalhe":"Parece que Baruque não estava satisfeito com sua situação na vida. (Jer. 45:3; w25.07 22 §§ 8-9) Sem contentamento, podemos perder nossa alegria e tomar decisões ruins. (w25.07 20 § 2) Jeová ajudou Baruque a mudar o seu ponto de vista dando a ele uma esperança. (Jer. 45:5; w25.07 24 §§ 13-14)","tipo":"discurso","texto":"Parece que Baruque não estava satisfeito com sua situação na vida. (Jer. 45:3; w25.07 22 §§ 8-9) Sem contentamento, podemos perder nossa alegria e tomar decisões ruins. (w25.07 20 § 2) Jeová ajudou Baruque a mudar o seu ponto de vista dando a ele uma esperança. (Jer. 45:5; w25.07 24 §§ 13-14)","sec":"tesouros"},{"n":2,"titulo":"Joias espirituais","min":10,"detalhe":"Jer. 46:22 — Em que sentido o som do Egito seria “como o de uma serpente deslizando”? (it “Voz” § 16)","tipo":"joias","texto":"Jer. 46:22 — Em que sentido o som do Egito seria “como o de uma serpente deslizando”? (it “Voz” § 16)","sec":"tesouros"},{"n":3,"titulo":"Leitura da Bíblia","min":4,"licao":{"pub":"th","n":10,"ponto":null,"txt":"th lição 10"},"detalhe":"Jer. 46:13-24 (th lição 10)","tipo":"leitura","passagem":"Jer. 46:13-24","texto":"Jer. 46:13-24","sec":"tesouros"},{"n":4,"titulo":"Iniciando conversas","min":3,"licao":{"pub":"lmd","n":2,"ponto":3,"txt":"lmd lição 2 ponto 3"},"detalhe":"TESTEMUNHO INFORMAL. Comece a conversar com alguém que parece estar feliz. (lmd lição 2 ponto 3)","tipo":"estudante","cena":"TESTEMUNHO INFORMAL","texto":"Comece a conversar com alguém que parece estar feliz.","sec":"ministerio"},{"n":5,"titulo":"Iniciando conversas","min":2,"licao":{"pub":"lmd","n":4,"ponto":5,"txt":"lmd lição 4 ponto 5"},"detalhe":"DE CASA EM CASA. A pessoa está irritada. (lmd lição 4 ponto 5)","tipo":"estudante","cena":"DE CASA EM CASA","texto":"A pessoa está irritada.","sec":"ministerio"},{"n":6,"titulo":"Iniciando conversas","min":2,"licao":{"pub":"lmd","n":2,"ponto":4,"txt":"lmd lição 2 ponto 4"},"detalhe":"DE CASA EM CASA. Uma pessoa que parece estar triste vem atender. (lmd lição 2 ponto 4)","tipo":"estudante","cena":"DE CASA EM CASA","texto":"Uma pessoa que parece estar triste vem atender.","sec":"ministerio"},{"n":7,"titulo":"Discurso","min":4,"licao":{"pub":"th","n":7,"ponto":null,"txt":"th lição 7"},"apendiceA":20,"detalhe":"lmd apêndice A ponto 20 — Tema: Jesus não é o Deus Todo-Poderoso. (th lição 7)","tipo":"discurso_estudante","texto":"lmd apêndice A ponto 20 — Tema: Jesus não é o Deus Todo-Poderoso.","sec":"ministerio"},{"n":8,"titulo":"‘Partilhe com outros o que você tem’","min":15,"consideracao":true,"detalhe":"Consideração. Em suas cartas, o apóstolo Paulo muitas vezes falou sobre a importância de dividir com outros o que temos. Os conselhos dele foram muito importantes para os cristãos daquela época, e continuam sendo hoje. — Efé. 4:28; 1 Tim. 6:17, 18. Leia Hebreus 13:16. Pouco depois de receberem o conselho de Paulo, os cristãos na Judeia tiveram que fugir para os montes, deixando para trás casa, trabalho e muitas coisas que tinham. Nessa época, provavelmente surgiu uma grande necessidade de todos os cristãos dividirem suas coisas uns com os outros. ˙ Por que seria bom para os cristãos daquela época aplicar os conselhos de Paulo? ˙ Pensando no que vai acontecer em breve, por que é importante aprender desde já a compartilhar com outros o que temos? Leia 2 Coríntios 8:2-4. (nota de estudo em 2 Cor. 8:2, nwtsty) ˙ O que podemos aprender do exemplo dos macedônios? ˙ O que mais podemos compartilhar com outros, além de coisas materiais? Mostre o VÍDEO Torne-se Amigo de Jeová — Divida Suas Coisas com Outros. Depois, pergunte: ˙ Que exemplo Jeová nos dá sobre dividir as coisas com outros?","tipo":"consideracao","texto":"Em suas cartas, o apóstolo Paulo muitas vezes falou sobre a importância de dividir com outros o que temos. Os conselhos dele foram muito importantes para os cristãos daquela época, e continuam sendo hoje. — Efé. 4:28; 1 Tim. 6:17, 18. Leia Hebreus 13:16. Pouco depois de receberem o conselho de Paulo, os cristãos na Judeia tiveram que fugir para os montes, deixando para trás casa, trabalho e muitas coisas que tinham. Nessa época, provavelmente surgiu uma grande necessidade de todos os cristãos dividirem suas coisas uns com os outros. ˙ Por que seria bom para os cristãos daquela época aplicar os conselhos de Paulo? ˙ Pensando no que vai acontecer em breve, por que é importante aprender desde já a compartilhar com outros o que temos? Leia 2 Coríntios 8:2-4. (nota de estudo em 2 Cor. 8:2, nwtsty) ˙ O que podemos aprender do exemplo dos macedônios? ˙ O que mais podemos compartilhar com outros, além de coisas materiais? Mostre o VÍDEO Torne-se Amigo de Jeová — Divida Suas Coisas com Outros. Depois, pergunte: ˙ Que exemplo Jeová nos dá sobre dividir as coisas com outros?","sec":"vida"},{"n":9,"titulo":"Estudo bíblico de congregação","min":30,"detalhe":"wcg cap. 13","tipo":"ebc","materia":"wcg cap. 13","texto":"wcg cap. 13","sec":"vida"}],"cantico_inicial":21,"cantico_final":87,"cantico_meio":117,"idioma":"pt","inicio":"2026-10-19","id":"pt-2026-10-19","periodo":"19–25 de outubro","leitura":"Jeremias 45-46","origem":"mwb_T_202609.pdf","proxima":{"periodo":"26 de outubro – 1 de novembro","leitura":"Jeremias 47-48","tema":"Jeová é um Juiz justo e misericordioso","vida":["Necessidades locais"],"ebc":"wcg cap. 14"}},{"partes":[{"n":1,"titulo":"Jeová é um Juiz justo e misericordioso","min":10,"detalhe":"Jeremias predisse que Jeová puniria Moabe por ter maltratado Judá. (Jer. 48:27, 29, 42; it “Moabe, Moabitas” n.u 2 § 22) Jeová não ficaria feliz em destruir Moabe. (Jer. 48:31, 36) Ele mostraria misericórdia a alguns moabitas. (Jer. 48:47; it “Moabe, Moabitas” n.u 2 § 24) PARA MEDITAR: O que a misericórdia de Jeová nos incentiva a fazer agora? — w24.05 17 § 10.","tipo":"discurso","texto":"Jeremias predisse que Jeová puniria Moabe por ter maltratado Judá. (Jer. 48:27, 29, 42; it “Moabe, Moabitas” n.u 2 § 22) Jeová não ficaria feliz em destruir Moabe. (Jer. 48:31, 36) Ele mostraria misericórdia a alguns moabitas. (Jer. 48:47; it “Moabe, Moabitas” n.u 2 § 24) PARA MEDITAR: O que a misericórdia de Jeová nos incentiva a fazer agora? — w24.05 17 § 10.","sec":"tesouros"},{"n":2,"titulo":"Joias espirituais","min":10,"detalhe":"Jer. 48:6 — Em que sentido os moabitas se tornariam “como um junípero no deserto”? (it “Junípero” n.u 2)","tipo":"joias","texto":"Jer. 48:6 — Em que sentido os moabitas se tornariam “como um junípero no deserto”? (it “Junípero” n.u 2)","sec":"tesouros"},{"n":3,"titulo":"Leitura da Bíblia","min":4,"licao":{"pub":"th","n":11,"ponto":null,"txt":"th lição 11"},"detalhe":"Jer. 48:1-13 (th lição 11)","tipo":"leitura","passagem":"Jer. 48:1-13","texto":"Jer. 48:1-13","sec":"tesouros"},{"n":4,"titulo":"Iniciando conversas","min":3,"licao":{"pub":"lmd","n":5,"ponto":4,"txt":"lmd lição 5 ponto 4"},"detalhe":"DE CASA EM CASA. (lmd lição 5 ponto 4)","tipo":"estudante","cena":"DE CASA EM CASA","texto":"","sec":"ministerio"},{"n":5,"titulo":"Cultivando o interesse","min":4,"licao":{"pub":"lmd","n":9,"ponto":5,"txt":"lmd lição 9 ponto 5"},"detalhe":"TESTEMUNHO INFORMAL. Fale sobre uma das verdades do apêndice A da brochura Ame as Pessoas. (lmd lição 9 ponto 5)","tipo":"estudante","cena":"TESTEMUNHO INFORMAL","texto":"Fale sobre uma das verdades do apêndice A da brochura Ame as Pessoas.","sec":"ministerio"},{"n":6,"titulo":"Fazendo discípulos","min":5,"licao":{"pub":"th","n":8,"ponto":null,"txt":"th lição 8"},"detalhe":"Incentive seu estudante a orar mais vezes. (th lição 8)","tipo":"estudante","texto":"Incentive seu estudante a orar mais vezes.","sec":"ministerio"},{"n":7,"titulo":"Necessidades locais","min":15,"detalhe":"","tipo":"necessidades","texto":"","s  una lista de personas a las que le gustaría ofrecerles un curso bíblico.","tipo":"consideracao","texto":"Durante este mes, ¿le gustaría encontrar a alguien que quiera estudiar la Biblia? Aumente sus probabilidades poniendo en práctica unas cuantas sugerencias sencillas que se dieron en un informe del Cuerpo Gobernante (1Co 9:26). Este informe se publicó en el 2024, durante la campaña para ofrecer cursos bíblicos. Ponga el VIDEO 2024 Informe 6 del Cuerpo Gobernante (fragmento). Luego pregunte: ˙ ¿Qué ha aprendido de las buenas experiencias del video? ˙ ¿Por qué es una buena idea apartar tiempo para predicar de casa en casa durante la campaña? ˙ ¿Qué es el método directo, y por qué suele dar tan buenos resultados? ˙ ¿Cómo podemos aprovechar bien el tiempo en el ministerio? Mencione el artículo “Una pregunta sencilla que cualquiera de nosotros puede hacer” (w25.02 30, 31). Luego pregunte: ˙ ¿Qué aprendemos de la experiencia de Mary? Haga una lista de personas a las que le gustaría ofrecerles un curso bíblico.","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 7.","tipo":"ebc","materia":"wcg cap. 7","texto":"wcg cap. 7.","sec":"vida"}],"cantico_inicial":1,"cantico_final":143,"cantico_meio":128,"idioma":"es","inicio":"2026-09-07","id":"es-2026-09-07","periodo":"7–13 de septiembre","leitura":"Jeremías 32, 33","origem":"mwb_S_202609.pdf","proxima":{"periodo":"14–20 de septiembre","leitura":"Jeremías 34, 35","tema":"Jehová recompensa a los que siempre le obedecen","vida":["El autocontrol nos ayuda a obedecer","Logros de la organización para el mes de septiembre"],"ebc":"wcg cap. 8"}},{"partes":[{"n":1,"titulo":"Jehová recompensa a los que siempre le obedecen","min":10,"detalhe":"Muchos judíos solo obedecían a Jehová cuando necesitaban su ayuda (Jer 34:8- 11; jr 49, 50 párrs. 13, 14). Los recabitas obedecieron al pie de la letra el mandato de Jehonadab (Jer 35:5, 6; jr 76 párrs. 17, 18). Jehová recompensó a los recabitas por ser fieles y obedientes (Jer 35:18, 19; it “Recabitas” párrs. 5, 6). PREGÚNTESE: “¿Estoy decidido a obedecer a Jehová siempre, incluso cuando creo que podría librarme de las consecuencias de desobedecer?”.","tipo":"discurso","texto":"Muchos judíos solo obedecían a Jehová cuando necesitaban su ayuda (Jer 34:8- 11; jr 49, 50 párrs. 13, 14). Los recabitas obedecieron al pie de la letra el mandato de Jehonadab (Jer 35:5, 6; jr 76 párrs. 17, 18). Jehová recompensó a los recabitas por ser fieles y obedientes (Jer 35:18, 19; it “Recabitas” párrs. 5, 6). PREGÚNTESE: “¿Estoy decidido a obedecer a Jehová siempre, incluso cuando creo que podría librarme de las consecuencias de desobedecer?”.","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Jer 34:7. ¿Qué pruebas arqueológicas confirman los hechos que se describen en este versículo? (it “Arqueología” párrs. 27, 28).","tipo":"joias","texto":"Jer 34:7. ¿Qué pruebas arqueológicas confirman los hechos que se describen en este versículo? (it “Arqueología” párrs. 27, 28).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":5,"ponto":null,"txt":"th lección 5"},"detalhe":"Jer 35:1-14 (th lección 5)","tipo":"leitura","passagem":"Jer 35:1-14","texto":"Jer 35:1-14","sec":"tesouros"},{"n":4,"titulo":"Empiece conversaciones","min":2,"licao":{"pub":"lmd","n":3,"ponto":3,"txt":"lmd lección 3 punto 3"},"detalhe":"DE CASA EN CASA. Ofrezca un curso de la Biblia (lmd lección 3 punto 3).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Ofrezca un curso de la Biblia","sec":"ministerio"},{"n":5,"titulo":"Empiece conversaciones","min":2,"licao":{"pub":"lmd","n":3,"ponto":5,"txt":"lmd lección 3 punto 5"},"detalhe":"DE CASA EN CASA. Ofrezca un curso de la Biblia. Presente y analice un video del kit de enseñanza, pero no lo ponga (lmd lección 3 punto 5).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Ofrezca un curso de la Biblia. Presente y analice un video del kit de enseñanza, pero no lo ponga","sec":"ministerio"},{"n":6,"titulo":"Haga revisitas","min":3,"licao":{"pub":"lmd","n":7,"ponto":4,"txt":"lmd lección 7 punto 4"},"detalhe":"PREDICACIÓN INFORMAL. Ofrézcale un curso de la Biblia a una persona que en otra ocasión le dijo que estaba preocupada por algo que vio en las noticias (lmd lección 7 punto 4).","tipo":"estudante","cena":"PREDICACIÓN INFORMAL","texto":"Ofrézcale un curso de la Biblia a una persona que en otra ocasión le dijo que estaba preocupada por algo que vio en las noticias","sec":"ministerio"},{"n":7,"titulo":"Haga discípulos","min":4,"licao":{"pub":"th","n":11,"ponto":null,"txt":"th lección 11"},"detalhe":"Converse con su estudiante de la Biblia. Háblele de la campaña para ofrecer cursos bíblicos. Pregúntele si conoce a alguien a quien le gustaría estudiar la Biblia (th lección 11).","tipo":"estudante","texto":"Converse con su estudiante de la Biblia. Háblele de la campaña para ofrecer cursos bíblicos. Pregúntele si conoce a alguien a quien le gustaría estudiar la Biblia","sec":"ministerio"},{"n":8,"titulo":"El autocontrol nos ayuda a obedecer","min":6,"consideracao":true,"detalhe":"Análisis con el auditorio. Hay pensamientos que nos desaniman y que podrían ir apagando nuestro deseo de hacer lo que está bien. Por eso es muy importante que nos esforcemos al máximo por controlar esos pensamientos. ¿Qué podemos hacer para lograrlo? Ponga el VIDEO Busquemos las cosas que fortalecen nuestra lealtad: El autodominio. Luego pregunte: ˙ ¿Qué le ha enseñado este video sobre cómo vencer los pensamientos negativos?","tipo":"consideracao","texto":"Hay pensamientos que nos desaniman y que podrían ir apagando nuestro deseo de hacer lo que está bien. Por eso es muy importante que nos esforcemos al máximo por controlar esos pensamientos. ¿Qué podemos hacer para lograrlo? Ponga el VIDEO Busquemos las cosas que fortalecen nuestra lealtad: El autodominio. Luego pregunte: ˙ ¿Qué le ha enseñado este video sobre cómo vencer los pensamientos negativos?","sec":"vida"},{"n":9,"titulo":"Logros de la organización para el mes de septiembre","min":9,"consideracao":true,"detalhe":"Análisis con el auditorio. Ponga el VIDEO. Luego haga las preguntas que aparecen al final del video.","tipo":"consideracao","texto":"Ponga el VIDEO. Luego haga las preguntas que aparecen al final del video.","sec":"vida"},{"n":10,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 8.","tipo":"ebc","materia":"wcg cap. 8","texto":"wcg cap. 8.","sec":"vida"}],"cantico_inicial":161,"cantico_final":28,"cantico_meio":121,"idioma":"es","inicio":"2026-09-14","id":"es-2026-09-14","periodo":"14–20 de septiembre","leitura":"Jeremías 34, 35","origem":"mwb_S_202609.pdf","proxima":{"periodo":"21–27 de septiembre","leitura":"Jeremías 36, 37","tema":"Jehová ayuda a quienes apoyan su Reino","vida":["Seamos siempre neutrales en nuestro corazón"],"ebc":"wcg cap. 9"}},{"partes":[{"n":1,"titulo":"Jehová ayuda a quienes apoyan su Reino","min":10,"detalhe":"Jeremías predicó un mensaje poco popular en una época de gran inestabilidad política en Judá (Jer 37:6-10; jr 27 párr. 22). Jeremías fue perseguido porque algunos pensaron que apoyaba al bando contrario (Jer 37:13-15; jr 28 párr. 23). Jehová ayudó a Jeremías mientras estaba en prisión (Jer 37:21; w08 15/10 11 párr. 18). PREGÚNTESE: “En épocas de inestabilidad política, ¿cómo puede el ejemplo de Jeremías y otros siervos fieles ayudarme a apoyar el Reino de Dios?”.","tipo":"discurso","texto":"Jeremías predicó un mensaje poco popular en una época de gran inestabilidad política en Judá (Jer 37:6-10; jr 27 párr. 22). Jeremías fue perseguido porque algunos pensaron que apoyaba al bando contrario (Jer 37:13-15; jr 28 párr. 23). Jehová ayudó a Jeremías mientras estaba en prisión (Jer 37:21; w08 15/10 11 párr. 18). PREGÚNTESE: “En épocas de inestabilidad política, ¿cómo puede el ejemplo de Jeremías y otros siervos fieles ayudarme a apoyar el Reino de Dios?”.","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Jer 36:30. ¿Cómo se cumplió la profecía de que Jehoiaquim no tendría sucesor? (it “Jehoiaquim” párr. 9).","tipo":"joias","texto":"Jer 36:30. ¿Cómo se cumplió la profecía de que Jehoiaquim no tendría sucesor? (it “Jehoiaquim” párr. 9).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":10,"ponto":null,"txt":"th lección 10"},"detalhe":"Jer 36:1-13 (th lección 10)","tipo":"leitura","passagem":"Jer 36:1-13","texto":"Jer 36:1-13","sec":"tesouros"},{"n":4,"titulo":"Empiece conversaciones","min":3,"licao":{"pub":"lmd","n":5,"ponto":5,"txt":"lmd lección 5 punto 5"},"detalhe":"PREDICACIÓN PÚBLICA. Ofrézcale un curso de la Biblia a una persona que no tiene antecedentes cristianos (lmd lección 5 punto 5).","tipo":"estudante","cena":"PREDICACIÓN PÚBLICA","texto":"Ofrézcale un curso de la Biblia a una persona que no tiene antecedentes cristianos","sec":"ministerio"},{"n":5,"titulo":"Haga revisitas","min":4,"licao":{"pub":"lmd","n":9,"ponto":4,"txt":"lmd lección 9 punto 4"},"detalhe":"DE CASA EN CASA. Ofrézcale un curso de la Biblia a una persona que aceptó un tratado en la visita anterior (lmd lección 9 punto 4).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Ofrézcale un curso de la Biblia a una persona que aceptó un tratado en la visita anterior","sec":"ministerio"},{"n":6,"titulo":"¿Qué diría?","min":6,"consideracao":true,"detalhe":"Análisis con el auditorio. DE CASA EN CASA. Repase brevemente Una obra de amor lección 2 punto 5. Luego pregunte: La persona está preocupada por la subida de los precios. ¿Qué le diría para demostrarle que entiende su preocupación? ¿Qué texto le mostraría?","tipo":"consideracao_min","cena":"DE CASA EN CASA","texto":"Repase brevemente Una obra de amor lección 2 punto 5. Luego pregunte: La persona está preocupada por la subida de los precios. ¿Qué le diría para demostrarle que entiende su preocupación? ¿Qué texto le mostraría?","sec":"ministerio"},{"n":7,"titulo":"Seamos siempre neutrales en nuestro corazón","min":15,"consideracao":true,"detalhe":"Análisis con el auditorio. Como el mundo cada vez está más dividido, no es de extrañar que nuestra neutralidad se ponga a prueba cada vez más. Para no hacer nada que viole nuestra neutralidad, debemos asegurarnos de no tomar partido en nuestro corazón (Pr 4:23). ˙ ¿Cómo podría ponerse a prueba su neutralidad en el lugar donde usted vive? ˙ ¿Por qué a veces podría ser difícil no tomar partido? Lea Lucas 4:5, 6. Luego pregunte: ˙ ¿Cómo le ayudan estos versículos a ser neutral? ˙ ¿Qué versículos usaría para explicar por qué ha decidido mantenerse neutral? Ponga el VIDEO Lecciones de “La Atalaya”: Seamos neutrales en este mundo dividido. Luego pregunte: ˙ ¿Qué aprendió en este video que puede ayudarle a ser neutral en su corazón? ˙ Según el artículo de estudio que se menciona en el video, ¿qué cuatro puntos clave nos pueden ayudar a seguir siendo neutrales? (w16.04 27-31).","tipo":"consideracao","texto":"Como el mundo cada vez está más dividido, no es de extrañar que nuestra neutralidad se ponga a prueba cada vez más. Para no hacer nada que viole nuestra neutralidad, debemos asegurarnos de no tomar partido en nuestro corazón (Pr 4:23). ˙ ¿Cómo podría ponerse a prueba su neutralidad en el lugar donde usted vive? ˙ ¿Por qué a veces podría ser difícil no tomar partido? Lea Lucas 4:5, 6. Luego pregunte: ˙ ¿Cómo le ayudan estos versículos a ser neutral? ˙ ¿Qué versículos usaría para explicar por qué ha decidido mantenerse neutral? Ponga el VIDEO Lecciones de “La Atalaya”: Seamos neutrales en este mundo dividido. Luego pregunte: ˙ ¿Qué aprendió en este video que puede ayudarle a ser neutral en su corazón? ˙ Según el artículo de estudio que se menciona en el video, ¿qué cuatro puntos clave nos pueden ayudar a seguir siendo neutrales? (w16.04 27-31).","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 9.","tipo":"ebc","materia":"wcg cap. 9","texto":"wcg cap. 9.","sec":"vida"}],"cantico_inicial":74,"cantico_final":134,"cantico_meio":142,"idioma":"es","inicio":"2026-09-21","id":"es-2026-09-21","periodo":"21–27 de septiembre","leitura":"Jeremías 36, 37","origem":"mwb_S_202609.pdf","proxima":{"periodo":"28 de septiembre a 4 de octubre","leitura":"Jeremías 38, 39","tema":"No dejemos de ayudarnos unos a otros","vida":["“¿Quién me tocó?”"],"ebc":"wcg cap. 10"}},{"partes":[{"n":1,"titulo":"No dejemos de ayudarnos unos a otros","min":10,"detalhe":"Hablemos a favor de otros, como hizo Ébed-Mélec (Jer 38:7-9; w13 15/1 9 párr. 12; vea la imagen de la portada). Consolemos a los demás, como hizo Jeremías (Jer 39:15-18; w19.11 6 párr. 17). Animemos a otros a obedecer a Jehová, como hizo Jeremías (Jer 38:20). PREGÚNTESE: “¿Necesita alguien en mi congregación que yo hable a su favor?” (w20.09 24 párrs. 15-17).","tipo":"discurso","texto":"Hablemos a favor de otros, como hizo Ébed-Mélec (Jer 38:7-9; w13 15/1 9 párr. 12; vea la imagen de la portada). Consolemos a los demás, como hizo Jeremías (Jer 39:15-18; w19.11 6 párr. 17). Animemos a otros a obedecer a Jehová, como hizo Jeremías (Jer 38:20). PREGÚNTESE: “¿Necesita alguien en mi congregación que yo hable a su favor?” (w20.09 24 párrs. 15-17).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Jer 39:6, 7. ¿Qué mala decisión tomó Sedequías, y qué pueden aprender los cabezas de familia de su mal ejemplo? (jr 92 párr. 1).","tipo":"joias","texto":"Jer 39:6, 7. ¿Qué mala decisión tomó Sedequías, y qué pueden aprender los cabezas de familia de su mal ejemplo? (jr 92 párr. 1).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":12,"ponto":null,"txt":"th lección 12"},"detalhe":"Jer 38:1-13 (th lección 12)","tipo":"leitura","passagem":"Jer 38:1-13","texto":"Jer 38:1-13","sec":"tesouros"},{"n":4,"titulo":"Empiece conversaciones","min":3,"licao":{"pub":"lmd","n":9,"ponto":3,"txt":"lmd lección 9 punto 3"},"detalhe":"PREDICACIÓN INFORMAL. Ofrézcale un curso de la Biblia a una persona que está preocupada por el clima extremo (lmd lección 9 punto 3).","tipo":"estudante","cena":"PREDICACIÓN INFORMAL","texto":"Ofrézcale un curso de la Biblia a una persona que está preocupada por el clima extremo","sec":"ministerio"},{"n":5,"titulo":"Haga revisitas","min":4,"licao":{"pub":"lmd","n":9,"ponto":5,"txt":"lmd lección 9 punto 5"},"detalhe":"PREDICACIÓN INFORMAL. Ofrézcale un curso de la Biblia a una persona que tiene hijos (lmd lección 9 punto 5).","tipo":"estudante","cena":"PREDICACIÓN INFORMAL","texto":"Ofrézcale un curso de la Biblia a una persona que tiene hijos","sec":"ministerio"},{"n":6,"titulo":"¿Qué diría?","min":6,"consideracao":true,"detalhe":"Análisis con el auditorio. DE CASA EN CASA. Repase brevemente Una obra de amor lección 1 punto 4. Mencione la imagen y luego pregunte: Según lo que vemos en la imagen, ¿qué pregunta podría hacer para empezar una conversación? ¿Qué texto mostraría?","tipo":"consideracao_min","cena":"DE CASA EN CASA","texto":"Repase brevemente Una obra de amor lección 1 punto 4. Mencione la imagen y luego pregunte: Según lo que vemos en la imagen, ¿qué pregunta podría hacer para empezar una conversación? ¿Qué texto mostraría?","sec":"ministerio"},{"n":7,"titulo":"“¿Quién me tocó?”","min":15,"consideracao":true,"detalhe":"Análisis con el auditorio. Ponga el VIDEO. Luego pregunte: ˙ ¿Qué podemos hacer para permitir que otros influyan positivamente en nosotros? ˙ ¿Qué podemos hacer para dejar una huella positiva en la vida de los demás?","tipo":"consideracao","texto":"Ponga el VIDEO. Luego pregunte: ˙ ¿Qué podemos hacer para permitir que otros influyan positivamente en nosotros? ˙ ¿Qué podemos hacer para dejar una huella positiva en la vida de los demás?","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 10.","tipo":"ebc","materia":"wcg cap. 10","texto":"wcg cap. 10.","sec":"vida"}],"cantico_inicial":102,"cantico_final":56,"cantico_meio":90,"idioma":"es","inicio":"2026-09-28","id":"es-2026-09-28","periodo":"28 de septiembre a 4 de octubre","leitura":"Jeremías 38, 39","origem":"mwb_S_202609.pdf","proxima":{"periodo":"5–11 de octubre","leitura":"Jeremías 40, 41","tema":"Tengamos un punto de vista equilibrado de la protección de Jehová","vida":["Jehová protege a las viudas"],"ebc":"wcg cap. 11"}},{"partes":[{"n":1,"titulo":"Tengamos un punto de vista equilibrado de la protección de Jehová","min":10,"detalhe":"Jehová protegió a Jeremías (Jer 40:2-4; jr 189 párr. 16). Aunque Guedalías temía a Dios, Jehová no evitó que muriera (Jer 41:1, 2; it “Guedalías” núm. 4). Jehová no siempre nos libra milagrosamente de los problemas, las enfermedades o la muerte (cl 72, 73 párrs. 13, 14). PARA MEDITAR: ¿Cómo nos protege Jehová a cada uno de nosotros hoy en día? (Pr 4: 5, 6; 1Te 5:14).","tipo":"discurso","texto":"Jehová protegió a Jeremías (Jer 40:2-4; jr 189 párr. 16). Aunque Guedalías temía a Dios, Jehová no evitó que muriera (Jer 41:1, 2; it “Guedalías” núm. 4). Jehová no siempre nos libra milagrosamente de los problemas, las enfermedades o la muerte (cl 72, 73 párrs. 13, 14). PARA MEDITAR: ¿Cómo nos protege Jehová a cada uno de nosotros hoy en día? (Pr 4: 5, 6; 1Te 5:14).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Jer 40:12. ¿Cómo demuestra este versículo que Jehová le dio a su pueblo la buena tierra descrita en Deuteronomio 8:6-8? (w06 15/6 16 párr. 4).","tipo":"joias","texto":"Jer 40:12. ¿Cómo demuestra este versículo que Jehová le dio a su pueblo la buena tierra descrita en Deuteronomio 8:6-8? (w06 15/6 16 párr. 4).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":2,"ponto":null,"txt":"th lección 2"},"detalhe":"Jer 40:1-10 (th lección 2)","tipo":"leitura","passagem":"Jer 40:1-10","texto":"Jer 40:1-10","sec":"tesouros"},{"n":4,"titulo":"Empiece conversaciones","min":2,"licao":{"pub":"lmd"
