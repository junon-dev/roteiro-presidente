as es un aspecto importante de nuestra adoración (Snt 1:27; nota de estudio “Trata con consideración” de 1Ti 5:3, nwtsty). ˙ ¿Cómo podemos honrar a las viudas hoy en día?","tipo":"consideracao","texto":"El rey David dijo que Jehová es “protector de viudas” (Sl 68:5). Y en la Biblia encontramos muchos relatos que demuestran cuánto se preocupa Jehová por ellas. ˙ Use las herramientas de investigación disponibles en su idioma para encontrar uno o dos relatos bíblicos que hablen sobre alguna viuda. ¿Cómo nos muestran estas historias que Jehová quiere y protege a las viudas? Si su esposo falleció, puede estar segura de que Jehová entiende sus sentimientos más profundos y sus necesidades. Él la protegerá y la ayudará, como hizo muchas veces en el pasado y lo sigue haciendo ahora. Ponga el VIDEO A pesar de perder a mi esposo, vuelvo a ser feliz. Luego pregunte: ˙ ¿Qué le enseña este video sobre cómo Jehová cuida y protege a las viudas hoy en día? Honrar y apoyar a las viudas es un aspecto importante de nuestra adoración (Snt 1:27; nota de estudio “Trata con consideración” de 1Ti 5:3, nwtsty). ˙ ¿Cómo podemos honrar a las viudas hoy en día?","sec":"vida"},{"n":9,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 11.","tipo":"ebc","materia":"wcg cap. 11","texto":"wcg cap. 11.","sec":"vida"}],"cantico_inicial":33,"cantico_final":38,"cantico_meio":17,"idioma":"es","inicio":"2026-10-05","id":"es-2026-10-05","periodo":"5–11 de octubre","leitura":"Jeremías 40, 41","origem":"mwb_S_202609.pdf","proxima":{"periodo":"12–18 de octubre","leitura":"Jeremías 42-44","tema":"Pidieron guía y luego la rechazaron","vida":["Necesidades de la congregación"],"ebc":"wcg cap. 12"}},{"partes":[{"n":1,"titulo":"Pidieron guía y luego la rechazaron","min":10,"detalhe":"Antes de huir a Egipto, Johanán y toda la gente le pidieron a Jeremías que orara por ellos para que Jehová los guiara (Jer 42:1-3; it “Johanán” núm. 5). La respuesta de Jehová fue clara: quédense en Judá, no vayan a Egipto (Jer 42:9, 10, 19). Ellos rechazaron la guía de Jehová (Jer 43: 4-7). PREGÚNTESE: “Cuando me dan un consejo basado en la Biblia, ¿lo pongo en práctica aunque no sea lo que quiero oír?” (w25.07 5 párr. 14).","tipo":"discurso","texto":"Antes de huir a Egipto, Johanán y toda la gente le pidieron a Jeremías que orara por ellos para que Jehová los guiara (Jer 42:1-3; it “Johanán” núm. 5). La respuesta de Jehová fue clara: quédense en Judá, no vayan a Egipto (Jer 42:9, 10, 19). Ellos rechazaron la guía de Jehová (Jer 43: 4-7). PREGÚNTESE: “Cuando me dan un consejo basado en la Biblia, ¿lo pongo en práctica aunque no sea lo que quiero oír?” (w25.07 5 párr. 14).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Jer 44:18. ¿Por qué era incorrecto que los israelitas dijeran que estaban sufriendo porque habían dejado de “hacerle sacrificios a la Reina del Cielo”? (it “Terquedad” párr. 4).","tipo":"joias","texto":"Jer 44:18. ¿Por qué era incorrecto que los israelitas dijeran que estaban sufriendo porque habían dejado de “hacerle sacrificios a la Reina del Cielo”? (it “Terquedad” párr. 4).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":11,"ponto":null,"txt":"th lección 11"},"detalhe":"Jer 43:1-13 (th lección 11)","tipo":"leitura","passagem":"Jer 43:1-13","texto":"Jer 43:1-13","sec":"tesouros"},{"n":4,"titulo":"Empiece conversaciones","min":3,"licao":{"pub":"lmd","n":1,"ponto":5,"txt":"lmd lección 1 punto 5"},"detalhe":"PREDICACIÓN INFORMAL. (lmd lección 1 punto 5).","tipo":"estudante","cena":"PREDICACIÓN INFORMAL","texto":"","sec":"ministerio"},{"n":5,"titulo":"Haga revisitas","min":4,"licao":{"pub":"lmd","n":7,"ponto":4,"txt":"lmd lección 7 punto 4"},"detalhe":"DE CASA EN CASA. Utilice una de las verdades del apéndice A del folleto Una obra de amor (lmd lección 7 punto 4).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Utilice una de las verdades del apéndice A del folleto Una obra de amor","sec":"ministerio"},{"n":6,"titulo":"¿Qué diría?","min":6,"consideracao":true,"detalhe":"Análisis con el auditorio. PREDICACIÓN INFORMAL. Repase brevemente Una obra de amor lección 2 punto 3. Mencione la imagen y luego pregunte: ¿Cómo podría empezar a conversar con un hombre que está leyendo la Biblia u otro libro religioso? ¿Qué le preguntaría para saber qué verdad bíblica le podría interesar? ¿Qué texto le mostraría?","tipo":"consideracao_min","cena":"PREDICACIÓN INFORMAL","texto":"Repase brevemente Una obra de amor lección 2 punto 3. Mencione la imagen y luego pregunte: ¿Cómo podría empezar a conversar con un hombre que está leyendo la Biblia u otro libro religioso? ¿Qué le preguntaría para saber qué verdad bíblica le podría interesar? ¿Qué texto le mostraría?","sec":"ministerio"},{"n":7,"titulo":"Necesidades de la congregación","min":15,"detalhe":"","tipo":"necessidades","texto":"","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 12.","tipo":"ebc","materia":"wcg cap. 12","texto":"wcg cap. 12.","sec":"vida"}],"cantico_inicial":103,"cantico_final":129,"cantico_meio":47,"idioma":"es","inicio":"2026-10-12","id":"es-2026-10-12","periodo":"12–18 de octubre","leitura":"Jeremías 42-44","origem":"mwb_S_202609.pdf","proxima":{"periodo":"19–25 de octubre","leitura":"Jeremías 45, 46","tema":"La esperanza es clave para estar contentos","vida":["“No se olviden [5] de compartir lo que tienen”"],"ebc":"wcg cap. 13"}},{"partes":[{"n":1,"titulo":"La esperanza es clave para estar contentos","min":10,"detalhe":"Al parecer, Baruc no estaba contento con su situación en la vida (Jer 45:3; w25.07 22 párrs. 8, 9). Si dejamos de estar contentos con lo que tenemos, podemos perder la alegría y tomar malas decisiones (w25.07 20 párr. 2). Jehová le dio esperanza a Baruc, y eso lo ayudó a corregir el rumbo (Jer 45:5; w25.07 24 párrs. 13, 14).","tipo":"discurso","texto":"Al parecer, Baruc no estaba contento con su situación en la vida (Jer 45:3; w25.07 22 párrs. 8, 9). Si dejamos de estar contentos con lo que tenemos, podemos perder la alegría y tomar malas decisiones (w25.07 20 párr. 2). Jehová le dio esperanza a Baruc, y eso lo ayudó a corregir el rumbo (Jer 45:5; w25.07 24 párrs. 13, 14).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Jer 46:22. ¿Por qué dice este versículo que Egipto sonaría “como una serpiente que se arrastra”? (it “Voz” párr. 16).","tipo":"joias","texto":"Jer 46:22. ¿Por qué dice este versículo que Egipto sonaría “como una serpiente que se arrastra”? (it “Voz” párr. 16).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":10,"ponto":null,"txt":"th lección 10"},"detalhe":"Jer 46:13-24 (th lección 10)","tipo":"leitura","passagem":"Jer 46:13-24","texto":"Jer 46:13-24","sec":"tesouros"},{"n":4,"titulo":"Empiece conversaciones","min":3,"licao":{"pub":"lmd","n":2,"ponto":3,"txt":"lmd lección 2 punto 3"},"detalhe":"PREDICACIÓN INFORMAL. Empiece una conversación con alguien que parece estar contento (lmd lección 2 punto 3).","tipo":"estudante","cena":"PREDICACIÓN INFORMAL","texto":"Empiece una conversación con alguien que parece estar contento","sec":"ministerio"},{"n":5,"titulo":"Empiece conversaciones","min":2,"licao":{"pub":"lmd","n":4,"ponto":5,"txt":"lmd lección 4 punto 5"},"detalhe":"DE CASA EN CASA. La persona está enojada (lmd lección 4 punto 5).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"La persona está enojada","sec":"ministerio"},{"n":6,"titulo":"Empiece conversaciones","min":2,"licao":{"pub":"lmd","n":2,"ponto":4,"txt":"lmd lección 2 punto 4"},"detalhe":"DE CASA EN CASA. La persona que abre la puerta se ve triste (lmd lección 2 punto 4).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"La persona que abre la puerta se ve triste","sec":"ministerio"},{"n":7,"titulo":"Discurso","min":4,"licao":{"pub":"th","n":7,"ponto":null,"txt":"th lección 7"},"detalhe":"lmd apéndice A punto 20. Título: Jesús no es Dios (th lección 7).","tipo":"discurso_estudante","texto":"lmd apéndice A punto 20. Título: Jesús no es Dios","sec":"ministerio"},{"n":8,"titulo":"“No se olviden [5] de compartir lo que tienen”","min":15,"consideracao":true,"detalhe":"Análisis con el auditorio. En sus cartas, el apóstol Pablo recalcó la importancia de ser generosos. Sus palabras fueron muy útiles en aquel entonces, y lo siguen siendo ahora (Ef 4:28; 1Ti 6:17, 18). Lea Hebreos 13:16. Poco después de recibir este consejo de Pablo, los cristianos de Judea huyeron a las montañas. Tuvieron que dejar sus casas, sus trabajos y muchas de sus cosas. Todo parece indicar que en aquel momento era vital que los cristianos compartieran lo que tenían con los demás. ˙ ¿Cómo beneficiaría el consejo de Pablo a los cristianos que lo pusieran en práctica? ˙ Teniendo en cuenta lo que ocurrirá en el futuro, ¿por qué es importante que aprendamos ahora a compartir lo que tenemos? Lea 2 Corintios 8:2-4 (nota de estudio de 2Co 8:2, nwtsty). ˙ ¿Qué aprendemos del buen ejemplo de las congregaciones de Macedonia? ˙ Además de las cosas materiales, ¿qué más podemos compartir? Ponga el VIDEO Hazte amigo de Jehová: Aprende a compartir. Luego pregunte: ˙ Jehová comparte sus cosas. ¿Qué nos enseña eso a nosotros?","tipo":"consideracao","texto":"En sus cartas, el apóstol Pablo recalcó la importancia de ser generosos. Sus palabras fueron muy útiles en aquel entonces, y lo siguen siendo ahora (Ef 4:28; 1Ti 6:17, 18). Lea Hebreos 13:16. Poco después de recibir este consejo de Pablo, los cristianos de Judea huyeron a las montañas. Tuvieron que dejar sus casas, sus trabajos y muchas de sus cosas. Todo parece indicar que en aquel momento era vital que los cristianos compartieran lo que tenían con los demás. ˙ ¿Cómo beneficiaría el consejo de Pablo a los cristianos que lo pusieran en práctica? ˙ Teniendo en cuenta lo que ocurrirá en el futuro, ¿por qué es importante que aprendamos ahora a compartir lo que tenemos? Lea 2 Corintios 8:2-4 (nota de estudio de 2Co 8:2, nwtsty). ˙ ¿Qué aprendemos del buen ejemplo de las congregaciones de Macedonia? ˙ Además de las cosas materiales, ¿qué más podemos compartir? Ponga el VIDEO Hazte amigo de Jehová: Aprende a compartir. Luego pregunte: ˙ Jehová comparte sus cosas. ¿Qué nos enseña eso a nosotros?","sec":"vida"},{"n":9,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 13.","tipo":"ebc","materia":"wcg cap. 13","texto":"wcg cap. 13.","sec":"vida"}],"cantico_inicial":21,"cantico_final":87,"cantico_meio":117,"idioma":"es","inicio":"2026-10-19","id":"es-2026-10-19","periodo":"19–25 de octubre","leitura":"Jeremías 45, 46","origem":"mwb_S_202609.pdf","proxima":{"periodo":"26 de octubre a 1 de noviembre","leitura":"Jeremías 47, 48","tema":"Jehová es un juez justo y misericordioso","vida":["Necesidades de la congregación"],"ebc":"wcg cap. 14"}},{"partes":[{"n":1,"titulo":"Jehová es un juez justo y misericordioso","min":10,"detalhe":"Jeremías predijo que Jehová castigaría a Moab por cómo había tratado a Judá (Jer 48:27, 29, 42; it “Moab, moabitas” núm. 2 párr. 22). A Jehová no le causaría ningún placer acabar con Moab (Jer 48:31, 36). Jehová sería misericordioso con algunos moabitas (Jer 48:47; it “Moab, moabitas” núm. 2 párr. 24). PARA MEDITAR: ¿Qué nos motiva a hacer ahora la misericordia de Jehová? (w24.05 17 párr. 10).","tipo":"discurso","texto":"Jeremías predijo que Jehová castigaría a Moab por cómo había tratado a Judá (Jer 48:27, 29, 42; it “Moab, moabitas” núm. 2 párr. 22). A Jehová no le causaría ningún placer acabar con Moab (Jer 48:31, 36). Jehová sería misericordioso con algunos moabitas (Jer 48:47; it “Moab, moabitas” núm. 2 párr. 24). PARA MEDITAR: ¿Qué nos motiva a hacer ahora la misericordia de Jehová? (w24.05 17 párr. 10).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Jer 48:6. ¿En qué sentido llegaron a ser los moabitas “como un enebro en el desierto”? (it “Enebro” núm. 2).","t :8-11). PARA MEDITAR: “¿Qué puedo hacer para no ser como Sedequías?” (w17.10 23, 24 párrs. 11, 12).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Jer 51:6, 7, 36. ¿En qué se parecen la advertencia que Jeremías anunció y la advertencia que nosotros damos hoy? (jr 165 párr. 21; 167 párr. 25).","tipo":"joias","texto":"Jer 51:6, 7, 36. ¿En qué se parecen la advertencia que Jeremías anunció y la advertencia que nosotros damos hoy? (jr 165 párr. 21; 167 párr. 25).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":5,"ponto":null,"txt":"th lección 5"},"detalhe":"Jer 52:6-20 (th lección 5)","tipo":"leitura","passagem":"Jer 52:6-20","texto":"Jer 52:6-20","sec":"tesouros"},{"n":4,"titulo":"Empecemos conversaciones","min":3,"licao":{"pub":"lmd","n":3,"ponto":3,"txt":"lmd lección 3 punto 3"},"detalhe":"DE CASA EN CASA. Ofrece un curso bíblico de forma directa (lmd lección 3 punto 3).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Ofrece un curso bíblico de forma directa","sec":"ministerio"},{"n":5,"titulo":"Empecemos conversaciones","min":4,"licao":{"pub":"lmd","n":3,"ponto":4,"txt":"lmd lección 3 punto 4"},"detalhe":"DE CASA EN CASA. En la conversación, mencionas que Jesús es el Hijo de Dios. La persona te dice que no está de acuerdo (lmd lección 3 punto 4).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"En la conversación, mencionas que Jesús es el Hijo de Dios. La persona te dice que no está de acuerdo","sec":"ministerio"},{"n":6,"titulo":"Discurso","min":5,"licao":{"pub":"th","n":7,"ponto":null,"txt":"th lección 7"},"detalhe":"lmd apéndice A punto 21. Título: El Reino de Dios es un gobierno real que está en el cielo (th lección 7).","tipo":"discurso_estudante","texto":"lmd apéndice A punto 21. Título: El Reino de Dios es un gobierno real que está en el cielo","sec":"ministerio"},{"n":7,"titulo":"Nuestras donaciones le dan gloria al gran nombre de Jehová","min":15,"consideracao":true, a “la hermosura de Israel desde los cielos a la tierra”? (w07 1/6 9 párr. 1).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":10,"ponto":null,"txt":"th lección 10"},"detalhe":"Lam 1:8-18 (th lección 10)","tipo":"leitura","passagem":"Lam 1:8-18","texto":"Lam 1:8-18","sec":"tesouros"},{"n":4,"titulo":"Empecemos conversaciones","min":3,"licao":{"pub":"lmd","n":2,"ponto":4,"txt":"lmd lección 2 punto 4"},"detalhe":"PREDICACIÓN INFORMAL. Empieza una conversación amigable que termina antes de que puedas predicar (lmd lección 2 punto 4).","tipo":"estudante","cena":"PREDICACIÓN INFORMAL","texto":"Empieza una conversación amigable que termina antes de que puedas predicar","sec":"ministerio"},{"n":5,"titulo":"Hagamos revisitas","min":4,"licao":{"pub":"lmd","n":9,"ponto":4,"txt":"lmd lección 9 punto 4"},"detalhe":"PREDICACIÓN PÚBLICA. Presenta y analiza un video del kit de enseñanza y ofrece un curso de la Biblia (lmd lección 9 punto 4).","tipo":"estudante","cena":"PREDICACIÓN PÚBLICA","texto":"Presenta y analiza un video del kit de enseñanza y ofrece un curso de la Biblia","sec":"ministerio"},{"n":6,"titulo":"¿Qué dirías?","min":5,"consideracao":true,"detalhe":"Análisis con el auditorio. DE CASA EN CASA. Repasa brevemente Una obra de amor lección 1 punto 4b. Menciona la imagen y luego pregunta: Según lo que vemos en la imagen, ¿qué pregunta podrías hacer para empezar una conversación? ¿Qué texto mostrarías?","tipo":"consideracao_min","cena":"DE CASA EN CASA","texto":"Repasa brevemente Una obra de amor lección 1 punto 4b. Menciona la imagen y luego pregunta: Según lo que vemos en la imagen, ¿qué pregunta podrías hacer para empezar una conversación? ¿Qué texto mostrarías?","sec":"ministerio"},{"n":7,"titulo":"No nos olvidemos de nuestros hermanos inactivos","min":15,"consideracao":true,"detalhe":"Análisis con el auditorio. Dedicamos mucho tiempo y esfuerzo a encontrar a personas que quieran aprender de Jehová y servirle. Pero no debemos olvidarnos de “nuestros hermanos en la fe” que están inactivos (Gál 6:10). ¿Qué pudiera llevar a nuestros hermanos a volverse inactivos? Algunos se enfrascan en su trabajo, se sienten superados por los problemas de la vida o sufren depresión u otros problemas de salud. Otros se sienten culpables por errores cometidos o se sienten mal porque alguien los ofendió o hirió sus sentimientos. Muchos de ellos siguen amando a Jehová, pero no se sienten dignos de retomar las actividades espirituales. Los ancianos hacen todo lo posible por ayudar a los inactivos a volver a Jehová (1Pe 5:2). Pero ¿qué podemos hacer todos para ayudar a nuestros hermanos inactivos? Pon el VIDEO Animemos a los inactivos. Luego pregunta: ˙ ¿Qué aprendiste en este video?","tipo":"consideracao","texto":"Dedicamos mucho tiempo y esfuerzo a encontrar a personas que quieran aprender de Jehová y servirle. Pero no debemos olvidarnos de “nuestros hermanos en la fe” que están inactivos (Gál 6:10). ¿Qué pudiera llevar a nuestros hermanos a volverse inactivos? Algunos se enfrascan en su trabajo, se sienten superados por los problemas de la vida o sufren depresión u otros problemas de salud. Otros se sienten culpables por errores cometidos o se sienten mal porque alguien los ofendió o hirió sus sentimientos. Muchos de ellos siguen amando a Jehová, pero no se sienten dignos de retomar las actividades espirituales. Los ancianos hacen todo lo posible por ayudar a los inactivos a volver a Jehová (1Pe 5:2). Pero ¿qué podemos hacer todos para ayudar a nuestros hermanos inactivos? Pon el VIDEO Animemos a los inactivos. Luego pregunta: ˙ ¿Qué aprendiste en este video?","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 17.","tipo":"ebc","materia":"wcg cap. 17","texto":"wcg cap. 17.","sec":"vida"}],"cantico_inicial":28,"cantico_final":75,"cantico_meio":90,"idioma":"es","inicio":"2026-11-16","id":"es-2026-11-16","periodo":"16–22 de noviembre","leitura":"Lamentaciones 1, 2","o :3,"txt":"lmd lección 4 punto 3"},"detalhe":"PREDICACIÓN INFORMAL. Ofrece un tratado (lmd lección 4 punto 3).","tipo":"estudante","cena":"PREDICACIÓN INFORMAL","texto":"Ofrece un tratado","sec":"ministerio"},{"n":6,"titulo":"Discurso","min":5,"licao":{"pub":"th","n":16,"ponto":null,"txt":"th lección 16"},"detalhe":"w25.12 26-30. Título: Los mayores son un tesoro para la congregación (th lección 16).","tipo":"discurso_estudante","texto":"w25.12 26-30. Título: Los mayores son un tesoro para la congregación","sec":"ministerio"},{"n":7,"titulo":"Ayudemos a los cuidadores a no rendirse","min":15,"consideracao":true,"detalhe":"Análisis con el auditorio. Para los cristianos verdaderos es todo un honor cuidar de nuestros seres queridos. Pero eso no significa que sea una tarea fácil. Por eso Jehová ayuda a los cuidadores para que no se rindan. Lo hace, por ejemplo, mediante los hermanos de la congregación. Lee Proverbios 20:18 y Filipenses 2:4. Luego pregunta: ˙ ¿Cómo pueden los miembros de una familia poner esto en práctica al cuidar de sus seres queridos? Pon el VIDEO Consuelo para los cuidadores. Luego pregunta: ˙ ¿Qué implica ser cuidador? ˙ ¿Cómo pueden los cuidadores cuidarse a sí mismos? ˙ ¿Qué puede hacer la congregación para ayudar a los cuidadores? ˙ ¿Cómo les ayuda Jehová a los cuidadores a no rendirse? Si deseas más información, lee el artículo “Cómo mantener la alegría al cuidar de un ser querido”, de La Atalaya de noviembre de 2025.","tipo":"consideracao","texto":"Para los cristianos verdaderos es todo un honor cuidar de nuestros seres queridos. Pero eso no significa que sea una tarea fácil. Por eso Jehová ayuda a los cuidadores para que no se rindan. Lo hace, por ejemplo, mediante los hermanos de la congregación. Lee Proverbios 20:18 y Filipenses 2:4. Luego pregunta: ˙ ¿Cómo pueden los miembros de una familia poner esto en práctica al cuidar de sus seres queridos? Pon el VIDEO Consuelo para los cuidadores. Luego pregunta: ˙ ¿Qué implica ser cuidador? ˙ ¿Cómo pueden los cuidadores cuidarse a sí mismos? ˙ ¿Qué puede hacer la congregación para ayudar a los cuidadores? ˙ ¿Cómo les ayuda Jehová a los cuidadores a no rendirse? Si deseas más información, lee el artículo “Cómo mantener la alegría al cuidar de un ser querido”, de La Atalaya de noviembre de 2025.","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 18.","tipo":"ebc","materia":"wcg cap. 18","texto":"wcg cap. 18.","sec":"vida"}],"cantico_inicial":158,"cantico_final":74,"cantico_meio":109,"idioma":"es","inicio":"2026-11-23","id":"es-2026-11-23","periodo":"23–29 de noviembre","leitura":"Lamentaciones 3-5","origem":"mwb_S_202611.pdf","proxima":{"periodo":"30 de noviembre a 6 de diciembre","leitura":"Ezequiel 1, 2","tema":"Avancemos al ritmo del carro celestial de Jehová","vida":["Necesidades de la congregación"],"ebc":"wcg cap. 19"}},{"partes":[{"n":1,"titulo":"Avancemos al ritmo del carro celestial de Jehová","min":10,"detalhe":"[Pon el VIDEO Información sobre Ezequiel]. El inmenso carro que vio Ezequiel representa la parte celestial de la organización de Jehová; este vehículo es el más rápido y maniobrable que existe (Eze 1:16-18; rr 37, 38 párrs. 18, 19; vea la imagen de la portada). Jehová dirige todos los movimientos de este carro (Eze 1:20, 26-28; rr 38, 39 párrs. 21-24). PARA MEDITAR: “¿Qué tengo que hacer para avanzar al ritmo del carro celestial?”.","tipo":"discurso","texto":"[Pon el VIDEO Información sobre Ezequiel]. El inmenso carro que vio Ezequiel representa la parte celestial de la organización de Jehová; este vehículo es el más rápido y maniobrable que existe (Eze 1:16-18; rr 37, 38 párrs. 18, 19; vea la imagen de la portada). Jehová dirige todos los movimientos de este carro (Eze 1:20, 26-28; rr 38, 39 párrs. 21-24). PARA MEDITAR: “¿Qué tengo que hacer para avanzar al ritmo del carro celestial?”.","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Eze 1:6, 10. Vistas en conjunto, ¿qué representan las cuatro caras de los querubines que Ezequiel vio en una visión? (rr 43 párr. 5; 45 párr. 13; 48 párr. 14).","tipo":"joias","texto":"Eze 1:6, 10. Vistas en conjunto, ¿qué representan las cuatro caras de los querubines que Ezequiel vio en una visión? (rr 43 párr. 5; 45 párr. 13; 48 párr. 14).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":2,"ponto":null,"txt":"th lección 2"},"detalhe":"Eze 2:1-10 (th lección 2)","tipo":"leitura","passagem":"Eze 2:1-10","texto":"Eze 2:1-10","sec":"tesouros"},{"n":4,"titulo":"Empecemos conversaciones","min":3,"licao":{"pub":"lmd","n":3,"ponto":3,"txt":"lmd lección 3 punto 3"},"detalhe":"DE CASA EN CASA. Ofrece un curso de la Biblia (lmd lección 3 punto 3).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Ofrece un curso de la Biblia","sec":"ministerio"},{"n":5,"titulo":"Hagamos discípulos","min":5,"licao":{"pub":"lmd","n":11,"ponto":5,"txt":"lmd lección 11 punto 5"},"detalhe":"Anima a un estudiante de la Biblia que está afrontando oposición de la familia (lmd lección 11 punto 5).","tipo":"estudante","texto":"Anima a un estudiante de la Biblia que está afrontando oposición de la familia","sec":"ministerio"},{"n":6,"titulo":"Discurso","min":4,"licao":{"pub":"th","n":6,"ponto":null,"txt":"th lección 6"},"detalhe":"lmd apéndice A punto 22. Título: El Reino de Dios reemplazará a todos los gobiernos humanos (th lección 6).","tipo":"discurso_estudante","texto":"lmd apéndice A punto 22. Título: El Reino de Dios reemplazará a todos los gobiernos humanos","sec":"ministerio"},{"n":7,"titulo":"Necesidades de la congregación","min":15,"detalhe":"","tipo":"necessidades","texto":"","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 19.","tipo":"ebc","materia":"wcg cap. 19","texto":"wcg cap. 19.","sec":"vida"}],"cantico_inicial":65,"cantico_final":134,"cantico_meio":63,"idioma":"es","inicio":"2026-11-30","id":"es-2026-11-30","periodo":"30 de noviembre a 6 de diciembre","leitura":"Ezequiel 1, 2","origem":"mwb_S_202611.pdf","proxima":{"periodo":"7–13 de diciembre","leitura":"Ezequiel 3, 4","tema":"Tenemos motivos para predicar sin miedo","vida":["Necesidades de la congregación"],"ebc":"wcg cap. 20"}},{"partes":[{"n":1,"titulo":"Tenemos motivos para predicar sin miedo","min":10,"detalhe":"Jehová nos da las fuerzas y el apoyo que necesitamos (Eze 3:8, 9; w22.11 5 párrs. 10, 11). El mensaje que llevamos viene de Jehová (Eze 3:10, 11; bt 134 párr. 7). Nuestra labor puede salvar vidas (Eze 3: 18, 19; 1Ti 4:16; w18.05 19 párrs. 8, 9).","tipo":"discurso","texto":"Jehová nos da las fuerzas y el apoyo que necesitamos (Eze 3:8, 9; w22.11 5 párrs. 10, 11). El mensaje que llevamos viene de Jehová (Eze 3:10, 11; bt 134 párr. 7). Nuestra labor puede salvar vidas (Eze 3: 18, 19; 1Ti 4:16; w18.05 19 párrs. 8, 9).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Eze 4:12-15. ¿Qué nos enseña que Jehová tuviera en cuenta la petición de Ezequiel? (w94 1/8 13 párrs. 14, 15).","tipo":"joias","texto":"Eze 4:12-15. ¿Qué nos enseña que Jehová tuviera en cuenta la petición de Ezequiel? (w94 1/8 13 párrs. 14, 15).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":2,"ponto":null,"txt":"th lección 2"},"detalhe":"Eze 3:16-27 (th lección 2)","tipo":"leitura","passagem":"Eze 3:16-27","texto":"Eze 3:16-27","sec":"tesouros"},{"n":4,"titulo":"Empecemos conversaciones","min":3,"licao":{"pub":"lmd","n":1,"ponto":5,"txt":"lmd lección 1 punto 5"},"detalhe":"DE CASA EN CASA. Enseña una verdad bíblica. Si quieres, puedes utilizar una de las que aparecen en el apéndice A del folleto Una obra de amor (lmd lección 1 punto 5).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Enseña una verdad bíblica. Si quieres, puedes utilizar una de las que aparecen en el apéndice A del folleto Una obra de amor","sec":"ministerio"},{"n":5,"titulo":"Empecemos conversaciones","min":4,"licao":{"pub":"lmd","n":4,"ponto":4,"txt":"lmd lección 4 punto 4"},"detalhe":"PREDICACIÓN PÚBLICA. La persona ha oído que los testigos de Jehová son una secta (lmd lección 4 punto 4).","tipo":"estudante","cena":"PREDICACIÓN PÚBLICA","texto":"La persona ha oído que los testigos de Jehová son una secta","sec":"ministerio"},{"n":6,"titulo":"Hagamos discípulos","min":5,"licao":{"pub":"lmd","n":12,"ponto":4,"txt":"lmd lección 12 punto 4"},"detalhe":"Habla con tu estudiante sobre la limpieza o la higiene personal (lmd lección 12 punto 4).","tipo":"estudante","texto":"Habla con tu estudiante sobre la limpieza o la higiene personal","sec":"ministerio"},{"n":7,"titulo":"Necesidades de la congregación","min":15,"detalhe":"","tipo":"necessidades","texto":"","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 20.","tipo":"ebc","materia":"wcg cap. 20","texto":"wcg cap. 20.","sec":"vida"}],"cantico_inicial":71,"cantico_final":7,"cantico_meio":161,"idioma":"es","inicio":"2026-12-07","id":"es-2026-12-07","periodo":"7–13 de diciembre","leitura":"Ezequiel 3, 4","origem":"mwb_S_202611.pdf","proxima":{"periodo":"14–20 de diciembre","leitura":"Ezequiel 5, 6","tema":"Los que adoran ídolos le causan mucho dolor a Jehová","vida":["¿Por qué no participamos en ceremonias nacionalistas?"],"ebc":"wcg cap. 21"}},{"partes":[{"n":1,"titulo":"Los que adoran ídolos le causan mucho dolor a Jehová","min":10,"detalhe":"El pueblo de Jehová cayó en la idolatría (Eze 5:11). La idolatría le “causó mucho dolor” a Jehová (Eze 6:9; w04 15/5 6 párrs. 2, 3). Los cristianos deben huir de la idolatría (1Co 10:14; rr 54 párr. 9).","tipo":"discurso","texto":"El pueblo de Jehová cayó en la idolatría (Eze 5:11). La idolatría le “causó mucho dolor” a Jehová (Eze 6:9; w04 15/5 6 párrs. 2, 3). Los cristianos deben huir de la idolatría (1Co 10:14; rr 54 párr. 9).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Eze 5:1, 2. ¿Cuál era el significado de lo que hizo Ezequiel? (rr 63 párr. 6).","tipo":"joias","texto":"Eze 5:1, 2. ¿Cuál era el significado de lo que hizo Ezequiel? (rr 63 párr. 6).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":5,"ponto":null,"txt":"th lección 5"},"detalhe":"Eze 6:1-10 (th lección 5)","tipo":"leitura","passagem":"Eze 6:1-10","texto":"Eze 6:1-10","sec":"tesouros"},{"n":4,"titulo":"Empecemos conversaciones","min":3,"licao":{"pub":"lmd","n":4,"ponto":5,"txt":"lmd lección 4 punto 5"},"detalhe":"PREDICACIÓN PÚBLICA. La persona quiere discutir (lmd lección 4 punto 5).","tipo":"estudante","cena":"PREDICACIÓN PÚBLICA","texto":"La persona quiere discutir","sec":"ministerio"},{"n":5,"titulo":"Hagamos revisitas","min":4,"licao":{"pub":"lmd","n":9,"ponto":4,"txt":"lmd lección 9 punto 4"},"detalhe":"DE CASA EN CASA. Ofrécele a la persona una revista sobre el tema del que hablaron en la visita anterior (lmd lección 9 punto 4).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Ofrécele a la persona una revista sobre el tema del que hablaron en la visita anterior","sec":"ministerio"},{"n":6,"titulo":"¿Qué dirías?","min":5,"consideracao":true,"detalhe":"Análisis con el auditorio. DE CASA EN CASA. Repasa brevemente Una obra de amor lección 1 punto 4b. Menciona la imagen y luego pregunta: Según lo que vemos en la imagen, ¿qué podrías decir para empezar una conversación? ¿Qué texto mostrarías?","tipo":"consideracao_min","cena":"DE CASA EN CASA","texto":"Repasa brevemente Una obra de amor lección 1 punto 4b. Menciona la imagen y luego pregunta: Según lo que vemos en la imagen, ¿qué podrías decir para empezar una conversación? ¿Qué texto mostrarías?","sec":"ministerio"},{"n":7,"titulo":"¿Por qué no participamos en ceremonias nacionalistas?","min":15,"consideracao":true,"detalhe":"Análisis con el auditorio. Los cristianos debemos evitar cualquier forma de idolatría. Por ejemplo, no participamos en ceremonias nacionalistas, pues implicaría adorar a algo o a alguien que no es Jehová (Mt 4:10). Mientras vemos el siguiente video, pensemos en las ceremonias patrióticas que son comunes en el lugar donde vivimos. Pon el VIDEO Seamos neutrales en los eventos públicos. Luego pregunta: ˙ ¿A quiénes podemos imitar para ser neutrales? ˙ ¿Qué pueden hacer las familias para que ninguna situación las agarre desprevenidas? ˙ ¿Qué información útil sobre este tema has encontrado en nuestras publicaciones?","tipo":"consideracao","texto":"Los cristianos debemos evitar cualquier forma de idolatría. Por ejemplo, no participamos en ceremonias nacionalistas, pues implicaría adorar a algo o a alguien que no es Jehová (Mt 4:10). Mientras vemos el siguiente video, pensemos en las ceremonias patrióticas que son comunes en el lugar donde vivimos. Pon el VIDEO Seamos neutrales en los eventos públicos. Luego pregunta: ˙ ¿A quiénes podemos imitar para ser neutrales? ˙ ¿Qué pueden hacer las familias para que ninguna situación las agarre desprevenidas? ˙ ¿Qué información útil sobre este tema has encontrado en nuestras publicaciones?","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de la congregación","min":30,"detalhe":"wcg cap. 21.","tipo":"ebc","materia":"wcg cap. 21","texto":"wcg cap. 21.","sec":"vida"}],"cantico_inicial":49,"cantico_final":133,"cantico_meio":153,"idioma":"es","inicio":"2026-12-14","id":"es-2026-12-14","periodo":"14–20 de diciembre","leitura":"Ezequiel 5, 6","origem":"mwb_S_202611.pdf","proxima":{"periodo":"21–27 de diciembre","leitura":"Ezequiel 7, 8","tema":"El día de Jehová no llegará tarde","vida":["Imagina cómo acabará la historia"],"ebc":"y cap. 22"}},{"partes":[{"n":1,"titulo":"El día de Jehová no llegará tarde","min":10,"detalhe":"Jehová siempre actúa en el momento justo (Eze 7:3; rr 67, 68 párrs. 13-15). Cuando llegó el momento de destruir Jerusalén, Jehová actuó porque los israelitas no habían cambiado; seguían con su conducta detestable (Eze 7:4, 10). Queremos aprovechar bien el tiempo porque sabemos que el día de Jehová no llegará tarde (rr 70 párr. 19).","tipo":"discurso","texto":"Jehová siempre actúa en el momento justo (Eze 7:3; rr 67, 68 párrs. 13-15). Cuando llegó el momento de destruir Jerusalén, Jehová actuó porque los israelitas no habían cambiado; seguían con su conducta detestable (Eze 7:4, 10). Queremos aprovechar bien el tiempo porque sabemos que el día de Jehová no llegará tarde (rr 70 párr. 19).","sec":"tesouros"},{"n":2,"titulo":"Busquemos perlas escondidas","min":10,"detalhe":"Eze 7:19. ¿Cómo se cumplirá esta profecía, y qué nos enseña? (w24.09 11 párr. 14).","tipo":"joias","texto":"Eze 7:19. ¿Cómo se cumplirá esta profecía, y qué nos enseña? (w24.09 11 párr. 14).","sec":"tesouros"},{"n":3,"titulo":"Lectura de la Biblia","min":4,"licao":{"pub":"th","n":2,"ponto":null,"txt":"th lección 2"},"detalhe":"Eze 8:7-18 (th lección 2)","tipo":"leitura","passagem":"Eze 8:7-18","texto":"Eze 8:7-18","sec":"tesouros"},{"n":4,"titulo":"Empecemos conversaciones","min":3,"licao":{"pub":"lmd","n":1,"ponto":4,"txt":"lmd lección 1 punto 4"},"detalhe":"DE CASA EN CASA. (lmd lección 1 punto 4).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"","sec":"ministerio"},{"n":5,"titulo":"Hagamos revisitas","min":4,"licao":{"pub":"lmd","n":9,"ponto":3,"txt":"lmd lección 9 punto 3"},"detalhe":"DE CASA EN CASA. Vuelves a visitar a una persona, pero no está en casa. Aprovechas la oportunidad para hablar con otro miembro de la familia (lmd lección 9 punto 3).","tipo":"estudante","cena":"DE CASA EN CASA","texto":"Vuelves a visitar a una persona, pero no está en casa. Aprovechas la oportunidad para hablar con otro miembro de la familia","sec":"ministerio"},{"n":6,"titulo":"Hagamos discípulos","min":5,"licao":{"pub":"lmd","n":12,"ponto":3,"txt":"lmd lección 12 punto 3"},"detalhe":"Ayuda a tu estudiante a prepararse para predicarle a un familiar (lmd lección 12 punto 3).","tipo":"estudante","texto":"Ayuda a tu estudiante a prepararse para predicarle a un familiar","sec":"ministerio"},{"n":7,"titulo":"Imagina cómo acabará la historia","min":15,"consideracao":true,"detalhe":"Análisis con el auditorio. Jehová les dijo a los israelitas infieles: “Haré que recaigan sobre ti los resultados de tu propia conducta, sufrirás las consecuencias de tus acciones detestables” (Eze 7:4). ¿Cuál es la lección para nosotros? Antes de dar el primer paso para hacer algo, es bueno pensar en cómo podrían acabar las cosas (Dt 32:29). Esto nos podría ayudar, por ejemplo, cuando nos veamos tentados a cometer un pecado grave. Debemos pararnos a pensar en las bendiciones que disfrutamos por ser leales a Jehová y en las consecuencias que sufriríamos si cayéramos en la tentación (Is 59:2). Lee Proverbios 27:11 y Filipenses 4:7. Luego pregunta: ˙ ¿Qué bendiciones tenemos por ser leales a Jehová? Lee Salmo 38:3-8. Luego pregunta: ˙ ¿Qué consecuencias podríamos sufrir si cometiéramos un pecado grave? Pon el VIDEO Contemplo ese día. Luego pregunta: ˙ ¿Qué es lo que más te ilusiona cuando te imaginas en el nuevo mundo?","tipo":"consideracao","texto":"Jehová les dijo a los israelitas infieles: “Haré que recaigan sobre ti los resultados de tu propia conducta, sufrirás las consecuencias de tus acciones detestables” (Eze 7:4). ¿Cuál es la lección para nosotros? Antes de dar el primer paso para hacer algo, es bueno pensar en cómo podrían acabar las cosas (Dt 32:29). Esto nos podría ayudar, por ejemplo, cuando nos veamos tentados a cometer un pecado grave. Debemos pararnos a pensar en las bendiciones que disfrutamos por ser leales a Jehová y en las consecuencias que sufriríamos si cayéramos en la tentación (Is 59:2). Lee Proverbios 27:11 y Filipenses 4:7. Luego pregunta: ˙ ¿Qué bendiciones tenemos por ser leales a Jehová? Lee Salmo 38:3-8. Luego pregunta: ˙ ¿Qué consecuencias podríamos sufrir si cometiéramos un pecado grave? Pon el VIDEO Contemplo ese día. Luego pregunta: ˙ ¿Qué es lo que más te ilusiona cuando te imaginas en el nuevo mundo?","sec":"vida"},{"n":8,"titulo":"Estudio bíblico de  }
};
const NOME_IDIOMA = {pt:'português', es:'español'};

/* =================== Ponte com o app Android =================== */
// No aplicativo Android existe window.AndroidApp; no navegador, não.
const APP = (typeof window.AndroidApp !== 'undefined') ? window.AndroidApp : null;
if (APP) document.documentElement.classList.add('no-app');

/* =================== Estado =================== */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('rp.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('rp.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('rp.'+k); }catch(e){} },
};
const CFG_PADRAO = { lang:'pt', inicio:'19:30', abertura:5, meio:4, som:true, vibrar:true, tela:true, tema:'auto' };
const S = {
  cfg: Object.assign({}, CFG_PADRAO, LS.get('cfg', {})),
  importadas: LS.get('importadas', []),   // semanas vindas de PDFs importados
  removidas: LS.get('removidas', []),     // ids de semanas embutidas que o usuário removeu
  semanaId: null, presidir: false, passos: [], passo: 0,
  t: { inicioPasso: 0, pausadoEm: null, acumuladoPausa: 0, avisado: false },
};
function salvarCfg(){ LS.set('cfg', S.cfg); }
function todasSemanas(){
  const mapa = new Map();
  for (const s of SEMANAS_EMBUTIDAS) if (!S.removidas.includes(s.id)) mapa.set(s.id, Object.assign({_emb:true}, s));
  for (const s of S.importadas) mapa.set(s.id, s);
  return [...mapa.values()].sort((a,b)=> a.inicio.localeCompare(b.inicio));
}
function semanasIdioma(){ return todasSemanas().filter(s => s.idioma === S.cfg.lang); }
function semanaAtual(){ return todasSemanas().find(s => s.id === S.semanaId) || null; }
function est(id){ return LS.get('sem.'+id, { sc:false, salas:false, v:{} }); }
function salvarEst(id, e){ LS.set('sem.'+id, e); }
const tx = () => T[S.cfg.lang];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(str, o){ return str.replace(/\{(\w+)\}/g, (m,k)=> o[k] != null ? o[k] : m); }
function hm(min){ const h = Math.floor(min/60)%24, m = Math.round(min%60); return h + ':' + String(m).padStart(2,'0'); }
function minDe(hhmm){ const [h,m] = (hhmm||'19:30').split(':').map(Number); return h*60+m; }
function hojeISO(){ const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }

function escolherSemanaPadrao(){
  const lst = semanasIdioma(); if (!lst.length) { S.semanaId = null; return; }
  const hoje = hojeISO();
  let alvo = lst.filter(s => s.inicio <= hoje).pop();
  if (alvo) { const fim = new Date(alvo.inicio); fim.setUTCDate(fim.getUTCDate()+7); if (fim.toISOString().slice(0,10) <= hoje) { const fut = lst.find(s=> s.inicio > hoje); if (fut) alvo = fut; } }
  S.semanaId = (alvo || lst[0]).id;
}

/* =================== Montagem do roteiro =================== */
function campo(k, ph, e){ return `<input class="campo" data-k="${k}" placeholder="${esc(ph)}" value="${esc(e.v[k]||'')}" size="${Math.max(9,(e.v[k]||ph).length+1)}" autocomplete="off">`; }
function area(k, ph, e){ return `<textarea class="campo" data-k="${k}" placeholder="${esc(ph)}" rows="1">${esc(e.v[k]||'')}</textarea>`; }
const fala = h => `<div class="fala">${h}</div>`;
const instr = h => `<div class="instr">${h}</div>`;

function proximaDe(sem){
  const d = new Date(sem.inicio+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+7);
  const iso = d.toISOString().slice(0,10);
  const p = todasSemanas().find(s => s.idioma === sem.idioma && s.inicio === iso);
  if (!p) return sem.proxima || null;
  const t1 = p.partes.find(x => x.n === 1), ebc = p.partes.find(x => x.tipo === 'ebc');
  return { periodo:p.periodo, leitura:p.leitura, tema:t1?t1.titulo:'', vida:p.partes.filter(x=>x.sec==='vida'&&x.tipo!=='ebc').map(x=>x.titulo), ebc: ebc?ebc.materia:'' };
}
function textoProxima(px, L){
  const s = tx();
  if (!px) return `<i>${s.prox_sem}</i>`;
  const q = L==='es' ? ['«','»'] : ['“','”'];
  const vida = px.vida && px.vida.length ? ` · ${esc(s.sec.vida)}: ${px.vida.map(esc).join('; ')}` : '';
  return `<b>${esc(px.periodo)}</b> · ${esc(px.leitura)} · ${q[0]}${esc(px.tema)}${q[1]}${vida}${px.ebc?' · '+esc(px.ebc):''}`;
}

function htmlConselho(p, e, L){
  const s = tx(), lic = p.licao, k = 'p'+p.n;
  let corpo = '';
  if (lic && LICOES[lic.pub] && LICOES[lic.pub][lic.n]) {
    const D = LICOES[lic.pub][lic.n][L] || LICOES[lic.pub][lic.n].pt;
    if (lic.pub === 'th') {
      corpo += `<div class="lic">${esc(lic.txt)} — ${esc(D.t)}</div><div class="obj">${esc(D.obj)}</div><ul class="pontos">` +
        D.p.map((t,i)=>`<li><input type="checkbox" data-k="chk.${k}.${i}" ${e.v['chk.'+k+'.'+i]?'checked':''}><span>${esc(t)}</span></li>`).join('') + '</ul>';
    } else {
      const sec = LICOES.secoesLmd[L][LICOES.lmd[lic.n].secao];
      corpo += `<div class="lic">${esc(lic.txt)} — ${esc(D.t)} <span style="font-weight:500;color:var(--suave)">· ${esc(sec)}</span></div><div class="obj"><b>${s.aprendemos}:</b> ${esc(D.l)}</div>`;
      const pontos = Object.entries(D.p);
      const foco = lic.ponto && D.p[lic.ponto] ? [[String(lic.ponto), D.p[lic.ponto]]] : pontos;
      corpo += '<ul class="pontos">' + foco.map(([n,[t,d]])=>`<li class="${lic.ponto?'destaque':''}"><input type="checkbox" data-k="chk.${k}.${n}" ${e.v['chk.'+k+'.'+n]?'checked':''}><span><b>${s.ponto} ${n} — ${esc(t)}.</b> ${esc(d)}</span></li>`).join('') + '</ul>';
      if (lic.ponto) corpo += `<details class="outros"><summary>${s.outros}</summary><ul class="pontos">` + pontos.filter(([n])=>+n!==lic.ponto).map(([n,[t,d]])=>`<li><span><b>${s.ponto} ${n} — ${esc(t)}.</b> ${esc(d)}</span></li>`).join('') + '</ul></details>';
    }
  } else if (lic) corpo += `<div class="lic">${esc(lic.txt)}</div>`;
  if (p.tipo === 'discurso_estudante') {
    if (p.apendiceA) corpo += `<div class="obj">${esc(LICOES.apendiceA[L])}</div>`;
    else if (/lmd\s+(?:lição|lección)\s+\d+/i.test(p.detalhe) && !/ponto|punto/i.test(p.detalhe)) corpo += `<div class="obj">${esc(LICOES.discursoLicao[L])}</div>`;
  }
  return `<div class="cons" id="cons-${p.n}"><div class="ch">${s.cons_t} <span>· ${s.cons_min}</span></div>${corpo}
    <div class="passos">${s.cons_passos}</div>${area('nota.'+k, s.f_notas, e)}<div class="aviso">${s.cons_obs}</div></div>`;
}

/* Gera blocos e passos (para o modo Presidir) */
function montar(sem, e){
  const s = tx(), L = sem.idioma, q = L==='es'?['«','»']:['“','”'];
  const sc = !!e.sc, salas = !!e.salas && !sc;
  const blocos = [];
  let t = minDe(S.cfg.inicio);
  const add = (b) => { b.hora = hm(t); b.ini = t; const dur = (b.passos||[]).reduce((a,x)=>a+x.dur,0); t += dur; blocos.push(b); return b; };
  const partes = sem.partes;
  const vidaPrim = partes.find(p => p.sec==='vida' && (p.tipo==='consideracao'));
  add({ id:'abertura', titulo: fmt(s.cantico_oracao,{n:sem.cantico_inicial||'?'}),
    corpo: fala(fmt(s.abre_fala,{meeting:esc(s.meeting), n:sem.cantico_inicial||'?', f:campo('oracaoIni', s.f_oracao, e)})),
    passos:[{dur:+S.cfg.abertura||5}] });
  add({ id:'ci', titulo: s.ci_t, dur:1,
    corpo: fala(fmt(s.ci_fala,{leitura:esc(sem.leitura), t1:esc((partes.find(p=>p.n===1)||{}).titulo||''), tv: vidaPrim? fmt(s.ci_tv,{t:esc(vidaPrim.titulo.replace(/^[‘’“”'"]+|[‘’“”'"]+$/g,''))}):''})) + instr(s.ci_instr) + area('pontos', s.f_pontos, e),
    passos:[{dur:1}] });
  let secAtual = null, ultimaEst = -1;
  partes.forEach((p,i)=>{ if (['leitura','estudante','discurso_estudante'].includes(p.tipo)) ultimaEst = i; });
  partes.forEach((p, i) => {
    if (p.sec !== secAtual) {
      if (p.sec === 'vida' && salas) add({ id:'salasVolta', cls:'sala', titulo:s.salas_volta_t, corpo: instr(s.salas_volta_instr), passos:[{dur:0}] });
      secAtual = p.sec;
      blocos.push({ secao: p.sec });
      if (p.sec === 'ministerio') blocos.push({ html:`<div class="dica">${s.min_tip}</div>` });
      if (p.sec === 'vida') add({ id:'meio', titulo: fmt(s.cantico,{n:sem.cantico_meio||'?'}), corpo: fala(fmt(s.meio_fala,{n:sem.cantico_meio||'?'})), passos:[{dur:+S.cfg.meio||4}] });
    }
    const k = 'p'+p.n, tit = `${p.n}. ${esc(p.titulo)}`;
    if (p.tipo === 'discurso') add({ id:k, sec:p.sec, titulo:tit, corpo: fala(fmt(s.disc_fala,{f:campo(k+'.orador', s.f_orador, e), t:esc(p.titulo)})), passos:[{dur:p.min}] });
    else if (p.tipo === 'joias') {
      add({ id:k, sec:p.sec, titulo:tit, corpo: fala(fmt(s.joias_fala,{f:campo(k+'.dir', s.f_dirigente, e), t:esc(p.titulo)})), passos:[{dur:p.min}] });
      if (salas) add({ id:'salasIda', cls:'sala', titulo:s.salas_ida_t, corpo: fala(s.salas_ida_fala)+instr(s.salas_ida_instr)+`<div>${campo('dirB', s.f_dir_b, e)}</div>`, passos:[{dur:0}] });
      else if (sc) blocos.push({ html:`<div class="nota-sc">${s.salas_sc}</div>` });
    }
    else if (['leitura','estudante','discurso_estudante'].includes(p.tipo)) {
      let corpo;
      if (p.tipo === 'leitura') corpo = fala(fmt(s.leit_fala,{d:esc(p.passagem||p.detalhe), f:campo(k+'.est', s.f_estudante, e)}));
      else if (p.tipo === 'estudante') {
        corpo = fala(fmt(s.est_fala,{t:esc(p.titulo), f1:campo(k+'.est', s.f_estudante, e), f2:campo(k+'.aj', s.f_ajudante, e)}));
        if (p.cena || p.texto) corpo += instr(`<b>${p.cena? s.cena : s.parte}:</b> ${esc([p.cena, p.texto].filter(Boolean).join('. '))}`);
      } else {
        const m = (p.texto||p.detalhe).match(/(?:Tema|Título|Titulo)\s*:\s*(.+?)\.?\s*$/i);
        corpo = fala(m ? fmt(s.est_disc_fala,{f:campo(k+'.est', s.f_estudante, e), tema:esc(m[1])}) : fmt(s.est_disc_fala2,{f:campo(k+'.est', s.f_estudante, e)}));
        if (p.texto) corpo += instr(esc(p.texto));
      }
      if (salas) corpo += `<div class="linha-b"><b>${s.sala_b}:</b> ${campo(k+'.estB', s.f_estudante, e)} ${p.tipo==='estudante'?campo(k+'.ajB', s.f_ajudante, e):''}</div>`;
      corpo += htmlConselho(p, e, L);
      add({ id:k, sec:p.sec, titulo:tit, tag:s.estudante, durTxt:`${p.min} + 1 min`, corpo, passos:[{dur:p.min}, {dur:1, cons:true, rot:s.cons_t}] });
    }
    else if (p.tipo === 'consideracao_min') add({ id:k, sec:p.sec, titulo:tit, corpo: fala(fmt(s.consid_fala,{f:campo(k+'.orador', s.f_orador, e), t:esc(p.titulo)})) + (p.texto?instr(esc(p.texto)):'') + instr(s.oqvd_obs), passos:[{dur:p.min}] });
    else if (p.tipo === 'consideracao') add({ id:k, sec:p.sec, titulo:tit, corpo: fala(fmt(s.consid_fala,{f:campo(k+'.orador', s.f_orador, e), t:esc(p.titulo.replace(/^[‘’“”'"]+|[‘’“”'"]+$/g,''))})) + instr(s.consid_obs), passos:[{dur:p.min}] });
    else if (p.tipo === 'necessidades') add({ id:k, sec:p.sec, titulo:tit, corpo: fala(fmt(s.nec_fala,{f:campo(k+'.orador', s.f_orador, e)})) + instr(s.nec_obs), passos:[{dur:p.min}] });
    else if (p.tipo === 'ebc') {
      if (sc) {
        add({ id:'scCf', cls:'scmuda', titulo:s.sc_cf_t, corpo: cfLista(sem, L, true) + area('anuncios', s.f_anuncios, e) + fala(fmt(s.sc_cf_fala,{f:campo('sc', s.f_sc, e)})), passos:[{dur:3}] });
        add({ id:'scDisc', cls:'scmuda', sec:'vida', titulo:s.sc_disc_t, corpo: instr(s.sc_disc_obs), passos:[{dur:30}] });
        add({ id:'scFim', cls:'scmuda', titulo:s.sc_fim_t, corpo: instr(s.sc_fim_obs) + `<div>${campo('scCantico', s.f_cantico, e)}</div>`, passos:[{dur: Math.max(0, minDe(S.cfg.inicio)+105 - t)}] });
      } else add({ id:k, sec:p.sec, titulo:tit, corpo: fala(fmt(s.ebc_fala,{t:esc(p.titulo), f1:campo(k+'.dir', s.f_dirigente, e), f2:campo(k+'.leitor', s.f_leitor, e)})) + instr(`${esc(p.materia||p.detalhe)} · ${s.ebc_instr}`), passos:[{dur:p.min}] });
    }
  });
  if (!sc) {
    add({ id:'cf', titulo:s.cf_t, corpo: cfLista(sem, L, false) + area('anuncios', s.f_anuncios, e) + instr(s.cf_aviso), passos:[{dur:3}] });
    add({ id:'fim', titulo: fmt(s.cantico_oracao,{n:sem.cantico_final||'?'}), corpo: fala(fmt(s.fim_fala,{n:sem.cantico_final||'?', f:campo('oracaoFim', s.f_oracao, e)})), passos:[{dur: Math.max(0, minDe(S.cfg.inicio)+105 - t)}] });
  }
  return { blocos, fim: hm(minDe(S.cfg.inicio)+105) };
}
function cfLista(sem, L, sc){
  const s = tx(), itens = s.cf_itens.map(x => fmt(x,{prox:textoProxima(proximaDe(sem), L)}));
  return `<ul class="check">${(sc ? [itens[0], itens[1], itens[3]] : itens).map(x=>`<li>${x}</li>`).join('')}</ul>`;
}

/* =================== Renderização =================== */
const $ = id => document.getElementById(id);
function aplicarTextos(){
  const s = tx();
  document.documentElement.lang = S.cfg.lang === 'es' ? 'es' : 'pt-BR';
  document.querySelectorAll('[data-t]').forEach(el => { const k = el.dataset.t; if (k === 'presidir') el.textContent = S.presidir ? s.sair : s.presidir; else if (s[k]) el.textContent = s[k]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === S.cfg.lang));
  document.title = s.app;
  document.documentElement.dataset.tema = S.cfg.tema === 'auto' ? '' : (S.cfg.tema === 'escuro' ? 'escuro' : 'claro');
}
function preencherSeletor(){
  const sel = $('selSemana'), lst = semanasIdioma();
  sel.innerHTML = lst.map(x => `<option value="${x.id}">${esc(x.periodo)} · ${esc(x.leitura)}</option>`).join('');
  if (S.semanaId) sel.value = S.semanaId;
}
function render(){
  aplicarTextos(); preencherSeletor();
  const s = tx(), sem = semanaAtual(), main = $('main');
  if (!sem) { main.innerHTML = `<div class="vazio">${fmt(s.vazio,{i:NOME_IDIOMA[S.cfg.lang]})}</div>`; S.passos = []; return; }
  const e = est(sem.id);
  const { blocos, fim } = montar(sem, e);
  let h = `<section class="cabsem"><div class="sup">${esc(s.meeting)} · ${esc(sem.leitura)} · ${esc(sem.periodo)}</div>
    <h1>${e.sc ? s.sc : s.normal}</h1>
    <div class="opcoes">
      <label class="chip ${e.sc?'on':''}"><input type="checkbox" id="opSC" ${e.sc?'checked':''}> ${s.visitaSC}</label>
      <label class="chip sala ${e.salas&&!e.sc?'on':''} ${e.sc?'trava':''}"><input type="checkbox" id="opSalas" ${e.salas&&!e.sc?'checked':''} ${e.sc?'disabled':''}> ${s.salas}</label>
      <label class="chip">${s.inicio} <input type="time" id="opInicio" value="${S.cfg.inicio}"></label>
      <button class="chip noprint" id="opImprimir" type="button">${s.imprimir}</button>
    </div>
    <details class="lembretes"><summary>${s.lembretes_t}</summary><ul>${s.lembretes.map(x=>`<li>${x}</li>`).join('')}</ul></details>
  </section>`;
  S.passos = [];
  for (const b of blocos) {
    if (b.secao) { h += `<div class="secao ${b.secao}">${esc(s.sec[b.secao])}</div>`; continue; }
    if (b.html) { h += b.html; continue; }
    const totalDur = b.passos.reduce((a,x)=>a+x.dur,0);
    const durTxt = b.durTxt || (totalDur ? totalDur + ' min' : '');
    h += `<div class="bloco ${b.sec||''} ${b.cls||''}" id="b-${b.id}"><div class="hora">${b.hora}</div><div class="cont">
      <div class="tit">${b.titulo}${b.tag?`<span class="tag">${esc(b.tag)}</span>`:''}${durTxt?`<span class="dur">${durTxt}</span>`:''}</div>${b.corpo}`;
    if (b.id === 'fim' || b.id === 'scFim') h += `<div class="termino">${s.termino}: <b>${fim}</b> · 1h45</div>`;
    h += `</div></div>`;
    let ini = b.ini;
    b.passos.forEach((p, i) => { S.passos.push({ bloco:b.id, titulo: (p.cons ? p.rot + ' — ' : '') + b.titulo.replace(/<[^>]+>/g,''), dur:p.dur, cons:!!p.cons, ini, consId: p.cons ? 'cons-' + b.id.slice(1) : null }); ini += p.dur; });
  }
  main.innerHTML = h;
  main.querySelectorAll('textarea.campo').forEach(autoAltura);
  if (S.presidir) marcarPasso(false);
}
function autoAltura(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 3) + 'px'; }

/* Edição de campos (delegação) */
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.k) return;
  const sem = semanaAtual(); if (!sem) return;
  const e = est(sem.id);
  e.v[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value;
  salvarEst(sem.id, e);
  if (el.tagName === 'TEXTAREA') autoAltura(el);
  if (el.tagName === 'INPUT' && el.type !== 'checkbox') el.size = Math.max(9, (el.value || el.placeholder).length + 1);
});
document.addEventListener('change', ev => {
  const el = ev.target, sem = semanaAtual();
  if (el.id === 'opSC' || el.id === 'opSalas') { const e = est(sem.id); e[el.id==='opSC'?'sc':'salas'] = el.checked; salvarEst(sem.id, e); render(); }
  if (el.id === 'opInicio' && el.value) { S.cfg.inicio = el.value; salvarCfg(); render(); }
});
document.addEventListener('click', ev => { if (ev.target.id === 'opImprimir') imprimir(); });
function imprimir(){
  if (APP) { const sem = semanaAtual(); try { APP.imprimir(tx().app + (sem ? ' — ' + sem.periodo : '')); } catch(e){} }
  else window.print();
}
/* Toque num bloco no modo Presidir: pula para ele */
$('main').addEventListener('click', ev => {
  if (!S.presidir) return;
  if (ev.target.closest('input,textarea,summary,button,label,details')) return;
  const b = ev.target.closest('.bloco'); if (!b) return;
  const id = b.id.slice(2), cons = ev.target.closest('.cons');
  const idx = S.passos.findIndex(p => p.bloco === id && (cons ? p.cons : !p.cons));
  if (idx >= 0 && idx !== S.passo) irPara(idx);
});

/* =================== Modo Presidir =================== */
let tick = null, wake = null;
function agoraMs(){ return Date.now(); }
function decorrido(){ const t = S.t; const fimRef = t.pausadoEm || agoraMs(); return (fimRef - t.inicioPasso - t.acumuladoPausa) / 1000; }
function irPara(i){
  S.passo = Math.max(0, Math.min(S.passos.length - 1, i));
  S.t = { inicioPasso: agoraMs(), pausadoEm: null, acumuladoPausa: 0, avisado: false };
  LS.set('presidir', { sem:S.semanaId, passo:S.passo, t:S.t });
  marcarPasso(true); atualizarBarra();
}
function marcarPasso(rolar){
  document.querySelectorAll('.bloco.atual,.cons.atual').forEach(x => x.classList.remove('atual'));
  document.querySelectorAll('.bloco.feito').forEach(x => x.classList.remove('feito'));
  const p = S.passos[S.passo]; if (!p) return;
  const vistos = new Set(S.passos.slice(0, S.passo).map(x => x.bloco));
  vistos.forEach(id => { if (id !== p.bloco) { const el = $('b-' + id); if (el) el.classList.add('feito'); } });
  const el = $('b-' + p.bloco); if (el) el.classList.add('atual');
  let alvo = el;
  if (p.cons && p.consId) { const c = $(p.consId); if (c) { c.classList.add('atual'); alvo = c; } }
  if (rolar && alvo) alvo.scrollIntoView({ behavior:'smooth', block: p.cons ? 'center' : 'start' });
}
function atualizarBarra(){
  const s = tx(), p = S.passos[S.passo]; if (!p) return;
  const dec = decorrido(), total = p.dur * 60, rest = total - dec;
  const rel = $('relogio');
  if (!p.dur) { rel.textContent = '—'; rel.className = 'rel'; }
  else {
    const v = Math.abs(rest), mm = Math.floor(v/60), ss = Math.floor(v%60);
    rel.textContent = (rest < 0 ? '+' : '') + mm + ':' + String(ss).padStart(2,'0');
    rel.className = 'rel' + (rest < 0 ? ' estouro' : rest <= Math.max(15, total*0.2) ? ' alerta' : '') + (S.t.pausadoEm ? ' pausa' : '');
    if (rest <= 0 && !S.t.avisado) { S.t.avisado = true; avisar(); }
  }
  $('agoraTit').textContent = `${S.passo+1}/${S.passos.length} · ${p.titulo}`;
  // adiantado / atrasado: compara a hora real com o início previsto do passo + decorrido
  const agora = new Date(), minAgora = agora.getHours()*60 + agora.getMinutes() + agora.getSeconds()/60;
  const previsto = p.ini + dec/60, dif = Math.round(minAgora - previsto);
  const st = Math.abs(dif) > 60 ? `${s.agora} ${hm(minAgora)}` : Math.abs(dif) < 1 ? s.noHorario : (dif > 0 ? `<b class="atr">${s.atrasado} ${dif} min</b>` : `<b class="adi">${s.adiantado} ${-dif} min</b>`);
  $('agoraStatus').innerHTML = `${s.previsto} ${hm(p.ini)} · ${st}${S.t.pausadoEm ? ' · ' + s.pausado : ''}`;
}
function avisar(){
  if (APP) { try { if (S.cfg.vibrar) APP.vibrar(); if (S.cfg.som) APP.bipe(); } catch(e){} return; }
  if (S.cfg.vibrar && navigator.vibrate) navigator.vibrate([250,120,250]);
  if (S.cfg.som) { try { const ctx = new (window.AudioContext||window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; g.gain.value = 0.08; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6); o.stop(ctx.currentTime + 0.62); } catch(e){} }
}
async function manterTela(on){
  if (APP) { try { APP.manterTela(!!(on && S.cfg.tela)); } catch(e){} return; }
  try { if (on && S.cfg.tela && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); else if (!on && wake) { await wake.release(); wake = null; } } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (S.presidir && document.visibilityState === 'visible') manterTela(true); });
function alternarPresidir(on){
  S.presidir = on; document.body.classList.toggle('presidir', on);
  $('btPresidir').classList.toggle('ativo', on);
  $('btPresidir').querySelector('svg').innerHTML = on ? '<path d="M6 6h12v12H6z"/>' : '<path d="M8 5v14l11-7z"/>';
  aplicarTextos();
  LS.set('presidirAtivo', on ? S.semanaId : null);
  if (on) {
    const salvo = LS.get('presidir', null);
    if (salvo && salvo.sem === S.semanaId && salvo.passo < S.passos.length && (Date.now() - salvo.t.inicioPasso) < 3*3600e3) { S.passo = salvo.passo; S.t = salvo.t; marcarPasso(true); atualizarBarra(); }
    else irPara(0);
    clearInterval(tick); tick = setInterval(atualizarBarra, 250); manterTela(true);
  } else { clearInterval(tick); manterTela(false); document.querySelectorAll('.atual,.feito').forEach(x=>x.classList.remove('atual','feito')); }
}
$('btPresidir').onclick = () => alternarPresidir(!S.presidir);
$('bProx').onclick = () => { if (S.passo < S.passos.length - 1) irPara(S.passo + 1); else toast(tx().fim); };
$('bAnt').onclick = () => irPara(S.passo - 1);
$('bPausa').onclick = () => { const t = S.t; if (t.pausadoEm) { t.acumuladoPausa += agoraMs() - t.pausadoEm; t.pausadoEm = null; } else t.pausadoEm = agoraMs(); LS.set('presidir', { sem:S.semanaId, passo:S.passo, t }); atualizarBarra(); };

/* =================== Navegação =================== */
$('selSemana').onchange = ev => { S.semanaId = ev.target.value; if (S.presidir) alternarPresidir(false); render(); window.scrollTo(0,0); };
function moverSemana(d){ const lst = semanasIdioma(), i = lst.findIndex(x=>x.id===S.semanaId); const n = lst[i+d]; if (n) { S.semanaId = n.id; if (S.presidir) alternarPresidir(false); render(); window.scrollTo(0,0); } }
$('semAnt').onclick = () => moverSemana(-1); $('semProx').onclick = () => moverSemana(1);
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  if (S.cfg.lang === b.dataset.lang) return;
  const atual = semanaAtual(); S.cfg.lang = b.dataset.lang; salvarCfg();
  const par = atual && semanasIdioma().find(x => x.inicio === atual.inicio);
  if (par) S.semanaId = par.id; else escolherSemanaPadrao();
  if (S.presidir) alternarPresidir(false);
  render();
});
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2400); }

/* =================== Painéis =================== */
function abrir(id, html){ const p = $(id); p.querySelector('.caixa').innerHTML = html; p.classList.add('aberto'); }
function fechar(id){ $(id).classList.remove('aberto'); }
document.querySelectorAll('.painel').forEach(p => p.addEventListener('click', ev => { if (ev.target === p || ev.target.closest('[data-fechar]')) p.classList.remove('aberto'); }));
const tituloPainel = t => `<h2>${t}<button data-fechar aria-label="Fechar">×</button></h2>`;

$('btConfig').onclick = () => {
  const s = tx(), c = S.cfg;
  abrir('pConfig', tituloPainel(s.config) + `
    <div class="campoform"><label>${s.idioma}</label><select id="cfLang"><option value="pt">Português</option><option value="es">Español</option></select></div>
    <div class="campoform"><label>${s.horaIni}</label><input type="time" id="cfInicio" value="${c.inicio}"></div>
    <div class="campoform"><label>${s.abertura}</label><input type="number" min="1" max="10" id="cfAbertura" value="${c.abertura}"></div>
    <div class="campoform"><label>${s.canticoMeio}</label><input type="number" min="1" max="10" id="cfMeio" value="${c.meio}"></div>
    <div class="campoform"><label>${s.som}</label><input type="checkbox" id="cfSom" ${c.som?'checked':''}></div>
    <div class="campoform"><label>${s.vibrar}</label><input type="checkbox" id="cfVibrar" ${c.vibrar?'checked':''}></div>
    <div class="campoform"><label>${s.tela}</label><input type="checkbox" id="cfTela" ${c.tela?'checked':''}></div>
    <div class="campoform"><label>${s.tema}</label><select id="cfTema"><option value="auto">${s.temaAuto}</option><option value="claro">${s.temaClaro}</option><option value="escuro">${s.temaEscuro}</option></select></div>
    <h3>${s.backup}</h3><p class="instr">${s.backupInfo}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cfExp">${s.exportar}</button>
    <label class="btn" style="display:inline-flex;align-items:center">${s.importarBk}<input type="file" id="cfImp" accept=".json,application/json" hidden></label>
    <button class="btn perigo" id="cfLimpar">${s.limparSem}</button></div>`);
  $('cfLang').value = c.lang; $('cfTema').value = c.tema;
  const upd = () => {
    const novoLang = $('cfLang').value;
    Object.assign(S.cfg, { inicio: $('cfInicio').value || '19:30', abertura: +$('cfAbertura').value || 5, meio: +$('cfMeio').value || 4,
      som: $('cfSom').checked, vibrar: $('cfVibrar').checked, tela: $('cfTela').checked, tema: $('cfTema').value });
    if (novoLang !== S.cfg.lang) { document.querySelector(`.lang button[data-lang="${novoLang}"]`).click(); }
    salvarCfg(); render();
  };
  $('pConfig').querySelectorAll('input:not([type=file]),select').forEach(el => el.addEventListener('change', upd));
  $('cfExp').onclick = exportar;
  $('cfImp').onchange = ev => importarBackup(ev.target.files[0]);
  $('cfLimpar').onclick = () => { const sem = semanaAtual(); if (sem && confirm(tx().confLimpar)) { LS.del('sem.' + sem.id); render(); toast(tx().limpo); } };
};
function exportar(){
  const dados = { versao:1, cfg:S.cfg, importadas:S.importadas, removidas:S.removidas, semanas:{} };
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('rp.sem.')) dados.semanas[k.slice(7)] = JSON.parse(localStorage.getItem(k)); }
  const nome = 'roteiro-presidente-' + hojeISO() + '.json', json = JSON.stringify(dados);
  if (APP) { APP.salvarArquivo(nome, 'application/json', json); return; }   // o app pergunta onde salvar
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  a.download = nome; a.click(); toast(tx().salvo);
}
async function importarBackup(f){
  if (!f) return;
  try { const d = JSON.parse(await f.text());
    if (d.cfg) S.cfg = Object.assign({}, CFG_PADRAO, d.cfg);
    if (d.importadas) S.importadas = d.importadas; if (d.removidas) S.removidas = d.removidas;
    for (const [id, v] of Object.entries(d.semanas || {})) salvarEst(id, v);
    salvarCfg(); LS.set('importadas', S.importadas); LS.set('removidas', S.removidas);
    escolherSemanaPadrao(); render(); fechar('pConfig'); toast(tx().importado);
  } catch(e) { alert(e.message); }
}

/* Apostilas: importar PDF */
// No app o pdf.js vem junto (funciona sem internet); no navegador vem da internet.
const PDFJS = APP ? 'pdfjs/' : 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function carregarPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((ok, erro) => { const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = () => erro(new Error('pdf.js')); document.head.appendChild(sc); });
}
function painelApostilas(msg){
  const s = tx(), lst = todasSemanas();
  const grupos = {};
  for (const x of lst) (grupos[x.idioma] = grupos[x.idioma] || []).push(x);
  let lista = '';
  for (const [i, arr] of Object.entries(grupos)) {
    const porArq = {};
    for (const x of arr) (porArq[x.origem || '—'] = porArq[x.origem || '—'] || []).push(x);
    lista += `<h3>${NOME_IDIOMA[i]}</h3><ul class="lista-ap">` + Object.entries(porArq).map(([arq, ws]) =>
      `<li><div><b>${esc(ws[0].periodo)} → ${esc(ws[ws.length-1].periodo)}</b><div class="q">${ws.length} ${s.semanas} · ${esc(arq)} · ${ws[0]._emb ? s.ap_emb : s.ap_imp}</div></div><button class="btn perigo" data-rem="${ws.map(x=>x.id).join(',')}">${s.ap_rem}</button></li>`).join('') + '</ul>';
  }
  abrir('pApostilas', tituloPainel(s.ap_t) + `<p>${s.ap_info}</p>
    <label class="drop" style="display:block"><b>${s.ap_escolher}</b><br><small>${s.ap_internet}</small><input type="file" id="apFile" accept="application/pdf,.pdf" multiple hidden></label>
    <div id="apMsg">${msg||''}</div><h3>${s.ap_lista}</h3>${lista}`);
  $('apFile').onchange = ev => importarPDFs([...ev.target.files]);
  $('pApostilas').querySelectorAll('[data-rem]').forEach(b => b.onclick = () => {
    const ids = b.dataset.rem.split(',');
    S.importadas = S.importadas.filter(x => !ids.includes(x.id));
    for (const id of ids) if (SEMANAS_EMBUTIDAS.some(x => x.id === id) && !S.removidas.includes(id)) S.removidas.push(id);
    LS.set('importadas', S.importadas); LS.set('removidas', S.removidas);
    if (ids.includes(S.semanaId)) escolherSemanaPadrao(); render(); painelApostilas();
  });
}
async function importarPDFs(arquivos){
  const s = tx(); let msgs = '';
  for (const f of arquivos) {
    $('apMsg').innerHTML = msgs + `<div class="msg">${fmt(s.ap_lendo,{f:esc(f.name)})}</div>`;
    try {
      const lib = await carregarPdfJs();
      const pdf = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
      const r = await LeitorApostila.analisarPDF(pdf, f.name);
      if (!r.semanas.length) { msgs += `<div class="msg erro">${fmt(s.ap_nada,{f:esc(f.name)})}</div>`; continue; }
      const ids = new Set(r.semanas.map(x => x.id));
      S.importadas = S.importadas.filter(x => !ids.has(x.id)).concat(r.semanas);
      S.removidas = S.removidas.filter(id => !ids.has(id));
      LS.set('importadas', S.importadas); LS.set('removidas', S.removidas);
      msgs += `<div class="msg ok">${fmt(s.ap_ok,{n:r.semanas.length, f:esc(f.name), i:NOME_IDIOMA[r.idioma]})}</div>`;
    } catch (e) { msgs += `<div class="msg erro">${fmt(s.ap_erro,{f:esc(f.name), e:esc(e.message||e)})}</div>`; }
  }
  if (!semanaAtual()) escolherSemanaPadrao();
  render(); painelApostilas(msgs);
}
$('btApostilas').onclick = () => painelApostilas();

/* Lições */
function painelLicoes(aba){
  const s = tx(), L = S.cfg.lang; aba = aba || 'th';
  let h = tituloPainel(s.lic_t) + `<div class="licoes-tabs"><button class="btn ${aba==='th'?'on':''}" data-aba="th">${s.lic_th}</button><button class="btn ${aba==='lmd'?'on':''}" data-aba="lmd">${s.lic_lmd}</button></div>`;
  if (L === 'es' && s.lic_prov) h += `<p class="instr">${s.lic_prov}</p>`;
  if (aba === 'th') for (const [n, d] of Object.entries(LICOES.th)) { const D = d[L]; h += `<div class="lic-item"><h4>${n}. ${esc(D.t)}</h4><p>${esc(D.obj)}</p><ul>${D.p.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; }
  else for (const [n, d] of Object.entries(LICOES.lmd)) { const D = d[L]; h += `<div class="lic-item"><h4>${n}. ${esc(D.t)} <span style="font-weight:500;color:var(--suave)">· ${esc(LICOES.secoesLmd[L][d.secao])}</span></h4><p><b>${s.aprendemos}:</b> ${esc(D.l)}</p><ul>${Object.entries(D.p).map(([k,[t,x]])=>`<li><b>${s.ponto} ${k} — ${esc(t)}.</b> ${esc(x)}</li>`).join('')}</ul></div>`; }
  abrir('pLicoes', h);
  $('pLicoes').querySelectorAll('[data-aba]').forEach(b => b.onclick = () => painelLicoes(b.dataset.aba));
}
$('btLicoes').onclick = () => painelLicoes();

/* =================== Integração com o app =================== */
// Botão "voltar" do Android: fecha painéis; durante o modo Presidir não sai do app.
window.voltarApp = function(){
  const aberto = document.querySelector('.painel.aberto');
  if (aberto) { aberto.classList.remove('aberto'); return 'ok'; }
  if (S.presidir) { toast(tx().usarSair); return 'ok'; }
  return 'sair';
};
window.aoSalvarArquivo = ok => toast(ok ? tx().salvo : tx().salvoErro);

/* =================== Início =================== */
escolherSemanaPadrao();
(function retomar(){
  // Se o app foi fechado no meio da reunião, volta direto para o modo Presidir
  const ativo = LS.get('presidirAtivo', null), salvo = LS.get('presidir', null);
  if (ativo && salvo && salvo.sem === ativo && (Date.now() - salvo.t.inicioPasso) < 3*3600e3 && todasSemanas().some(x => x.id === ativo)) {
    const sem = todasSemanas().find(x => x.id === ativo);
    if (sem.idioma !== S.cfg.lang) { S.cfg.lang = sem.idioma; salvarCfg(); }
    S.semanaId = ativo; render(); alternarPresidir(true);
  } else render();
})();
</script>
