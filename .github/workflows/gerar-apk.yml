name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar o APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests 'app.roteiro.presidente.RoteiroTest' assembleRelease 2>&1 | tee build.log

      - name: Mostrar erros da compilação
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Exception" -A4 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Preparar o arquivo
        id: apk
        run: |
          VERSAO=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          NOME="RoteiroPresidente-v${VERSAO}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NOME"
          echo "nome=$NOME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSAO}-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "versao=${VERSAO}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nome }}
          path: ${{ steps.apk.outputs.nome }}

      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.nome }}" \
            --title "Roteiro do Presidente ${{ steps.apk.outputs.versao }} (compilação ${{ github.run_number }})" \
            --notes "Baixe o arquivo .apk abaixo no tablet e toque nele para instalar."

      - name: Gerar imagens das telas (celular e tablet)
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests 'app.roteiro.presidente.Telas*' 2>&1 | tee telas.log || {
            grep -E "^e: |error:|What went wrong|FAILED|Exception|Caused by" -A4 telas.log | head -60 | while IFS= read -r l; do echo "::warning::$l"; done
            find app/build/test-results -name '*.xml' -exec grep -h -A6 "<failure" {} \; | head -60 | while IFS= read -r l; do echo "::warning::$l"; done
            exit 1; }

      - name: Anexar imagens das telas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls app/build/telas/*.png >/dev/null 2>&1; then
            cd app/build/telas && zip -q ../../../telas.zip *.png && cd -
            gh release upload "${{ steps.apk.outputs.tag }}" telas.zip --clobber || true
          fi
