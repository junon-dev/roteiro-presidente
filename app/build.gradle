plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Senha da chave: variável de ambiente RP_KEYSTORE_PASSWORD ou arquivo keystore/senha.txt
def senhaChave = System.getenv('RP_KEYSTORE_PASSWORD')
def arqSenha = rootProject.file('keystore/senha.txt')
if (!senhaChave && arqSenha.exists()) senhaChave = arqSenha.text.trim()

android {
    namespace 'app.roteiro.presidente'
    compileSdk 35

    defaultConfig {
        applicationId 'app.roteiro.presidente'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '2.4'
    }

    signingConfigs {
        roteiro {
            storeFile file(project.property('RP_KEYSTORE'))
            storePassword senhaChave
            keyAlias project.property('RP_KEY_ALIAS')
            keyPassword senhaChave
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.roteiro
        }
        debug {
            // mesma assinatura do release: atualiza por cima sem perder dados
            signingConfig signingConfigs.roteiro
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.05.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    testImplementation 'junit:junit:4.13.2'
}
